<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquilae</title>
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #18110d;
            --panel: rgba(24, 17, 13, 0.93);
            --panel-solid: #1d1510;
            --raised: rgba(255, 240, 210, 0.06);
            --raised-2: rgba(255, 240, 210, 0.1);
            --line: rgba(212, 174, 90, 0.28);
            --line-strong: rgba(212, 174, 90, 0.6);
            --gold: #d4ae5a;
            --gold-soft: #f0dca6;
            --text: #f3e9d4;
            --muted: #b5a487;
            --primary: #9b2a20;
            --primary-hover: #b4362a;
            --success: #3d7a3a;
            --success-hover: #4a9146;
            --danger: #7f241d;
            --danger-hover: #9a2e25;
            --radius: 14px;
            --shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
            --font-display: 'Cinzel', 'Trajan Pro', serif;
            --font-body: 'Lora', 'Palatino Linotype', Georgia, serif;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            font-family: var(--font-body);
            color: var(--text);
            background: #9fb6c2;
            -webkit-font-smoothing: antialiased;
        }
        #map { position: fixed; inset: 0; background: #9fb6c2; }
        .leaflet-tile-pane { filter: sepia(38%) saturate(78%) brightness(0.97) contrast(0.95); }
        body.phase-setup .leaflet-overlay-pane,
        body.phase-setup .leaflet-marker-pane { opacity: 0; pointer-events: none; }
        .leaflet-container { font-family: var(--font-body); }
        .leaflet-bar { border: 1px solid var(--line) !important; box-shadow: 0 6px 18px rgba(0,0,0,0.35) !important; border-radius: 10px !important; overflow: hidden; }
        .leaflet-bar a { background: var(--panel-solid) !important; color: var(--gold-soft) !important; border-bottom-color: var(--line) !important; }
        .leaflet-bar a:hover { background: #2a1f18 !important; }
        .leaflet-control-attribution { background: rgba(24,17,13,0.6) !important; color: var(--muted) !important; font-size: 10px; }
        .leaflet-control-attribution a { color: var(--gold-soft) !important; }

        /* ---------- Botones ---------- */
        button { font: inherit; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 11px 18px;
            border-radius: 10px;
            border: 1px solid var(--line-strong);
            background: var(--raised);
            color: var(--text);
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.06em;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
        }
        .btn:hover { background: var(--raised-2); border-color: var(--gold); }
        .btn:active { transform: translateY(1px); }
        .btn:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 2px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn svg { width: 18px; height: 18px; flex: none; }
        .btn--primary { background: linear-gradient(180deg, var(--primary-hover), var(--primary)); border-color: rgba(240, 220, 166, 0.55); color: #fff6e3; box-shadow: 0 6px 16px rgba(120, 25, 15, 0.35), inset 0 1px 0 rgba(255,255,255,0.12); }
        .btn--primary:hover { background: linear-gradient(180deg, #c4413a, var(--primary-hover)); border-color: var(--gold-soft); }
        .btn--success { background: var(--success); border-color: rgba(190, 230, 170, 0.45); color: #f1fbe9; }
        .btn--success:hover { background: var(--success-hover); }
        .btn--danger { background: var(--danger); border-color: rgba(255, 190, 170, 0.4); color: #ffeae4; }
        .btn--danger:hover { background: var(--danger-hover); }
        .btn--ghost { background: transparent; border-color: var(--line); color: var(--gold-soft); }
        .btn--small { padding: 8px 12px; font-size: 12px; border-radius: 8px; }
        .btn--block { width: 100%; }
        .btn--lg { padding: 15px 22px; font-size: 17px; letter-spacing: 0.1em; }
        .link-btn { background: none; border: none; padding: 0; color: var(--gold-soft); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font: inherit; }
        .link-btn:hover { color: #fff; }

        /* ---------- Tarjetas y modales ---------- */
        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            backdrop-filter: blur(6px);
        }
        .card::before {
            content: ""; position: absolute; inset: 6px; border: 1px solid rgba(212,174,90,0.14); border-radius: 10px; pointer-events: none;
        }
        .eyebrow { font-family: var(--font-display); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); margin: 0; }
        .modal {
            display: none; position: fixed; inset: 0; z-index: 3000;
            background: rgba(12, 8, 6, 0.6);
            backdrop-filter: blur(2px);
            justify-content: center; align-items: center; padding: 16px;
        }
        .modal-content { position: relative; width: 100%; max-width: 520px; padding: 28px; }
        .modal-content h3 { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: 0.06em; margin: 4px 0 18px; color: var(--gold-soft); text-align: center; }
        .modal-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 22px; }
        .field { display: block; margin: 0 0 14px; }
        .field > span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
        select, input[type="text"] {
            width: 100%;
            font: inherit; font-size: 15px;
            padding: 10px 12px;
            color: var(--text);
            background: rgba(0,0,0,0.35);
            border: 1px solid var(--line);
            border-radius: 9px;
            outline: none;
        }
        select:focus, input[type="text"]:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,174,90,0.18); }
        select option { background: var(--panel-solid); color: var(--text); }

        /* ---------- Pantalla inicial ---------- */
        #gameUI { position: fixed; z-index: 1600; }
        #gameUI.centered-setup {
            inset: 0;
            display: flex; align-items: center; justify-content: center;
            padding: 16px;
            background: radial-gradient(ellipse at center, rgba(12,8,6,0.15), rgba(12,8,6,0.55));
        }
        #setup { display: none; }
        #gameUI.centered-setup #setup { display: block; }
        .setup-card { position: relative; width: 100%; max-width: 640px; max-height: calc(100vh - 32px); overflow-y: auto; padding: 34px 38px 32px; }
        .back-btn {
            position: absolute; top: 16px; left: 16px; z-index: 1;
            display: inline-flex; align-items: center; gap: 4px;
            padding: 6px 10px 6px 6px; border-radius: 8px;
            background: transparent; border: 1px solid transparent;
            color: var(--muted); font-family: var(--font-body); font-size: 14px; cursor: pointer;
        }
        .back-btn svg { width: 18px; height: 18px; }
        .back-btn:hover { color: var(--gold-soft); border-color: var(--line); background: var(--raised); }
        .back-btn:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 2px; }
        .brand { text-align: center; margin-bottom: 26px; }
        .brand h1 {
            font-family: var(--font-display); font-weight: 900;
            font-size: 58px; letter-spacing: 0.16em; margin: 6px 0 4px; padding-left: 0.16em;
            background: linear-gradient(180deg, #f7e6b4 10%, #c99a3e 90%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            filter: drop-shadow(0 2px 0 rgba(0,0,0,0.45));
        }
        .brand p { margin: 0; color: var(--muted); font-style: italic; font-size: 15px; }
        .rule { height: 1px; margin: 16px auto 0; max-width: 300px; background: linear-gradient(90deg, transparent, var(--line-strong), transparent); }
        .setup-section { margin-top: 22px; }
        .setup-section__head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
        .setup-section__head h2 { font-family: var(--font-display); font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold-soft); margin: 0; }
        .segmented { display: inline-flex; padding: 3px; gap: 3px; background: rgba(0,0,0,0.35); border: 1px solid var(--line); border-radius: 10px; }
        .segmented button { border: none; background: transparent; color: var(--muted); font-family: var(--font-display); font-weight: 700; font-size: 13px; padding: 6px 13px; border-radius: 7px; cursor: pointer; }
        .segmented button[aria-pressed="true"] { background: var(--gold); color: var(--ink); }
        .segmented button:not([aria-pressed="true"]):hover { color: var(--text); }
        #numPlayers { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
        #players { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
        .player-entry { position: relative; }
        .player-entry input { padding-left: 46px; height: 46px; font-size: 16px; }
        .player-swatch {
            position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
            width: 22px; height: 22px; border-radius: 6px;
            box-shadow: 0 0 0 2px rgba(255,255,255,0.18), inset 0 -3px 0 rgba(0,0,0,0.25);
        }
        .questions-box { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
        .questions-box .btn { flex: none; }
        .questions-status { flex: 1 1 220px; margin: 0; font-size: 14px; line-height: 1.45; color: var(--muted); }
        .questions-status::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; background: var(--muted); }
        .questions-status.ready { color: #cfe8c0; }
        .questions-status.ready::before { background: #7cc36a; box-shadow: 0 0 0 3px rgba(124,195,106,0.2); }
        .questions-status.error { color: #ffc4b8; }
        .questions-status.error::before { background: #ff7b63; }
        .questions-extra { margin: 10px 2px 0; font-size: 13px; color: var(--muted); }
        .questions-extra a { color: var(--gold-soft); }
        #startGame { margin-top: 26px; }

        /* Overlay Nueva / Cargar */
        #initialOverlay { background: radial-gradient(ellipse at center, rgba(12,8,6,0.2), rgba(12,8,6,0.62)); backdrop-filter: none; }
        .welcome-card { max-width: 440px; text-align: center; padding: 38px 34px 32px; }
        .welcome-card .brand { margin-bottom: 28px; }
        .welcome-card .brand h1 { font-size: 50px; }
        .welcome-actions { display: grid; gap: 10px; }

        /* ---------- Panel de juego ---------- */
        #game { display: none; }
        #gameUI:not(.centered-setup) { top: 16px; right: 16px; width: 316px; max-height: calc(100vh - 32px); overflow-y: auto; }
        .game-card { position: relative; padding: 20px; }
        .turn { display: flex; align-items: center; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
        .turn__chip { width: 38px; height: 38px; border-radius: 10px; flex: none; box-shadow: 0 0 0 2px rgba(255,255,255,0.2), 0 0 18px var(--turn-color, transparent); background: var(--turn-color, #888); }
        .turn__name { font-family: var(--font-display); font-size: 21px; font-weight: 700; color: #fff4dc; line-height: 1.15; word-break: break-word; }
        .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
        .action-row .btn { padding: 11px 8px; white-space: nowrap; font-size: 13px; }
        body.phase-welcome #gameUI { display: none; }
        .attack-panel { display: none; margin-top: 12px; padding: 14px; border-radius: 10px; background: rgba(155, 42, 32, 0.16); border: 1px solid rgba(255, 120, 100, 0.3); }
        .attack-panel.is-visible { display: block; }
        .attack-panel .eyebrow { color: #ffb3a3; margin-bottom: 10px; }
        .attack-panel .field { margin-bottom: 10px; }
        .attack-panel select { font-size: 14px; padding: 8px 10px; }
        .attack-panel select:disabled { opacity: 0.55; }
        .attack-panel__note { font-size: 12.5px; line-height: 1.4; color: var(--muted); margin: 2px 0 12px; }
        .attack-panel__actions { display: grid; grid-template-columns: auto 1fr; gap: 8px; }
        .attack-panel__actions .btn { white-space: nowrap; padding: 9px 10px; letter-spacing: 0.02em; min-width: 0; }
        #attack[aria-pressed="true"] { box-shadow: inset 0 2px 6px rgba(0,0,0,0.45); border-color: var(--gold-soft); }
        #playersList { margin-top: 18px; }
        .players-title { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
        .player-info { position: relative; display: grid; grid-template-columns: 14px 1fr auto; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; border: 1px solid transparent; }
        .player-info + .player-info { margin-top: 4px; }
        .player-info.is-current { background: var(--raised); border-color: var(--line); }
        .player-color { width: 14px; height: 14px; border-radius: 4px; }
        .player-name { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .player-stats { font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
        .player-stats b { color: var(--text); font-weight: 600; }
        .player-bar { grid-column: 2 / 4; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.08); overflow: hidden; }
        .player-bar > i { display: block; height: 100%; border-radius: 4px; }
        .panel-footer { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
        .questions-left { grid-column: 1 / 3; font-size: 12px; color: var(--muted); text-align: center; margin-top: 2px; }
        #status { display: none; }

        /* ---------- Etiquetas de tropas ---------- */
        .troops-label { pointer-events: none; width: auto !important; height: auto !important; background: none; border: none; }
        .troops-label > div {
            transform: translate(-50%, -50%);
            min-width: 30px; height: 30px; padding: 0 7px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 15px;
            background: #1d1510;
            border: 2.5px solid var(--owner, var(--gold));
            color: #fbefd2;
            font-family: var(--font-display); font-weight: 700; font-size: 15px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.45);
            transition: opacity 0.15s ease, transform 0.15s ease;
        }
        .troops-label.is-dim > div { opacity: 0.35; }
        .troops-label.is-focus > div { transform: translate(-50%, -50%) scale(1.18); box-shadow: 0 0 0 3px rgba(255, 214, 107, 0.55), 0 4px 10px rgba(0,0,0,0.5); }
        .leaflet-interactive { transition: fill-opacity 0.15s ease; }
        body.attack-mode .leaflet-interactive { cursor: crosshair; }

        /* ---------- Pregunta ---------- */
        .question-card { max-width: 640px; }
        .battle { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: 0.04em; }
        .battle__side { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: rgba(0,0,0,0.3); border: 1px solid var(--line); }
        .battle__side i { width: 12px; height: 12px; border-radius: 3px; }
        .battle__side small { font-family: var(--font-body); color: var(--muted); font-weight: 400; }
        .battle__vs { color: var(--gold); }
        #questionText { margin: 0; font-size: 23px; line-height: 1.45; text-align: center; color: #fff6e2; }
        #answerText { margin: 20px 0 0; padding: 14px 16px; border-radius: 10px; background: rgba(212,174,90,0.12); border: 1px solid var(--line-strong); color: var(--gold-soft); font-size: 19px; text-align: center; }
        #answerText::before { content: "Respuesta"; display: block; font-family: var(--font-display); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }
        .result-buttons { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 22px; }

        /* ---------- Tropas ---------- */
        .province-name { text-align: center; font-family: var(--font-display); font-size: 20px; color: #fff4dc; margin-bottom: 4px; }
        .troops-controls { display: flex; align-items: center; justify-content: center; gap: 22px; margin: 18px 0 4px; }
        .troops-controls .btn { width: 48px; height: 48px; padding: 0; font-size: 24px; border-radius: 50%; }
        #currentTroops { font-family: var(--font-display); font-size: 40px; font-weight: 700; min-width: 64px; text-align: center; color: var(--gold-soft); }

        /* ---------- Victoria ---------- */
        .victory-card { max-width: 520px; text-align: center; }
        #victoryTitle { font-family: var(--font-display); font-weight: 900; font-size: 44px; letter-spacing: 0.08em; margin: 0; background: linear-gradient(180deg, #f7e6b4 10%, #c99a3e 90%); -webkit-background-clip: text; background-clip: text; color: transparent; }
        #victoryBadge { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 22px 0 6px; }
        #victoryColor { width: 64px; height: 64px; border-radius: 14px; box-shadow: 0 0 0 3px rgba(255,255,255,0.2), 0 10px 24px rgba(0,0,0,0.5); }
        #victoryName { font-family: var(--font-display); font-size: 26px; font-weight: 700; text-align: left; }
        #victoryDetails { color: var(--muted); text-align: left; margin-top: 4px; }

        @media (max-width: 700px) {
            .setup-card { padding: 26px 20px 22px; }
            .brand h1 { font-size: 40px; }
            #players { grid-template-columns: 1fr; }
            #gameUI:not(.centered-setup) { top: auto; bottom: 0; right: 0; left: 0; width: auto; max-height: 52vh; }
            #gameUI:not(.centered-setup) .game-card { border-radius: var(--radius) var(--radius) 0 0; }
            #questionText { font-size: 19px; }
            .troops-label > div { min-width: 24px; height: 24px; font-size: 12px; border-width: 2px; padding: 0 5px; }
        }
    </style>
</head>
<body class="phase-setup phase-welcome">
    <div id="map"></div>

    <div id="gameUI">
        <div id="setup">
            <div class="card setup-card">
                <button type="button" id="backToWelcome" class="back-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
                    Volver
                </button>
                <header class="brand">
                    <p class="eyebrow">Risk del Imperio Romano</p>
                    <h1>AQUILAE</h1>
                    <div class="rule" aria-hidden="true"></div>
                </header>

                <section class="setup-section">
                    <div class="setup-section__head">
                        <h2>Equipos</h2>
                        <div class="segmented" role="group" aria-label="Número de equipos">
                            <button type="button" data-players="2">2</button>
                            <button type="button" data-players="3">3</button>
                            <button type="button" data-players="4">4</button>
                        </div>
                        <select id="numPlayers" aria-hidden="true" tabindex="-1">
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                        </select>
                    </div>
                    <div id="players"></div>
                </section>

                <section class="setup-section">
                    <div class="setup-section__head"><h2>Preguntas</h2></div>
                    <div class="questions-box">
                        <button id="loadQuestionsButton" type="button" class="btn">Cargar preguntas</button>
                        <p id="questionsStatus" class="questions-status">Carga un archivo JSON con preguntas antes de empezar.</p>
                    </div>
                    <p class="questions-extra">
                        <button type="button" id="sampleQuestionsBtn" class="link-btn">Usar las preguntas de ejemplo sobre Roma</button>
                        · <a id="editorLink" href="editor-preguntas.html" target="_blank" rel="noopener">Crear mis propias preguntas</a>
                    </p>
                </section>
                <input id="questionsFileInput" type="file" accept="application/json" hidden />

                <button id="startGame" class="btn btn--primary btn--lg btn--block" disabled style="display:none;">Cargando mapa…</button>
            </div>
        </div>

        <div id="game">
            <div class="card game-card">
                <div class="turn">
                    <div class="turn__chip" id="turnChip"></div>
                    <div>
                        <p class="eyebrow">Turno de</p>
                        <div class="turn__name" id="currentPlayer"></div>
                    </div>
                </div>
                <div class="action-row">
                    <button id="attack" class="btn btn--primary" type="button">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5L3 6V3h3l11.5 11.5"/><path d="M13 19l6-6"/><path d="M16 16l4 4"/><path d="M19 21l2-2"/></svg>
                        Atacar
                    </button>
                    <button id="nextTurn" class="btn" type="button">Pasar turno</button>
                </div>
                <div class="attack-panel" id="attackPanel">
                    <p class="eyebrow">Elegir ataque</p>
                    <label class="field"><span>Provincia atacante</span><select id="attackerProvince"></select></label>
                    <label class="field"><span>Provincia objetivo</span><select id="targetProvince"></select></label>
                    <p class="attack-panel__note" id="attackNote"></p>
                    <div class="attack-panel__actions">
                        <button id="closeAttack" class="btn btn--ghost btn--small" type="button">Cancelar</button>
                        <button id="confirmAttack" class="btn btn--primary btn--small" type="button" disabled>Confirmar ataque</button>
                    </div>
                </div>
                <div id="status"></div>
                <div id="playersList"></div>
                <div class="panel-footer">
                    <button id="saveGame" class="btn btn--ghost btn--small" type="button" title="Guardar la partida en un archivo">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
    <!-- Código JavaScript -->
    <script>
    (function(){
        // Variables globales del juego
        let players = [];
        let provinces = [];
        let currentPlayerIndex = 0;
        let questions = [];
        let usedQuestions = [];
        let mapReady = false;
        let questionsReady = false;
        let loadedQuestionsFileName = '';
        let geoJsonLayer;
        let selectedProvince = null;
        let mapBaseVisible = true;

        // Mapa de conexiones marítimas (se llenará al cargar GeoJSON)
        let connectionsMap = {};
        // Función stub que será reemplazada cuando se construyan las conexiones
        function areConnectedBySea(aFeature, bFeature) {
            return false;
        }
        // Lista global de conexiones y capas dibujadas
        let seaConnectionsGlobal = [];
        let seaPolylineLayers = [];
        // Configuración de endpoints manuales para conexiones marítimas.
        // Clave: 'provinciaA|provinciaB' (nombres normalizados). Valores: { a: [lat, lng], b: [lat, lng] }
        // Valores por defecto (ejemplos). Se pueden sobreescribir guardando en localStorage bajo la clave
        // 'seaEndpointOffsetsConfig' como un JSON con la misma estructura.
        const seaEndpointOffsetsConfigDefaults = {
            'britannia|gallia': { a: [50.5, -3.5], b: [48.5, -2] },
            'magna grecia|africa': { a: [36.5, 15.0], b: [33.0, 13.0] },
            'baetica|mauretania': { a: [36.6, -3.5], b: [35.5, -3.0]  },
            'britannia|belgica': { a: [50.8, 0.0], b: [50.15, 1.85]  },
            'graecia|asia': { a: [39.0, 24.0], b: [38.5, 27.0]  },
            'magna grecia|cyrenaica': { a: [38.5, 16.6], b: [32.5, 20.6]}
        };
        // Cargar desde localStorage y merge con defaults
        let seaEndpointOffsetsConfig = (function(){
            try {
                const raw = localStorage.getItem('seaEndpointOffsetsConfig');
                if (raw) {
                    const parsed = JSON.parse(raw);
                    return Object.assign({}, seaEndpointOffsetsConfigDefaults, parsed || {});
                }
            } catch (e) {
                console.warn('No se pudo leer seaEndpointOffsetsConfig desde localStorage:', e);
            }
            return Object.assign({}, seaEndpointOffsetsConfigDefaults);
        })();
        function saveSeaEndpointOffsetsConfig() {
            try {
                localStorage.setItem('seaEndpointOffsetsConfig', JSON.stringify(seaEndpointOffsetsConfig));
            } catch (e) {
                console.warn('No se pudo guardar seaEndpointOffsetsConfig en localStorage:', e);
            }
        }
        // Normalizador global (puede ser sobrescrito internamente durante el procesamiento del GeoJSON)
        function normalizeName(n) {
            return (n || '').toString().trim().toLowerCase();
        }

        // Colores fijos para los jugadores
        const fixedColors = ['#C8372D', '#2E6DB4', '#3C8C3F', '#8A4FB8']; // Rojo, Azul, Verde, Púrpura
        const NEUTRAL_FILL = '#d8c69a';

        // Estado del ataque (se elige en el panel lateral o pulsando en el mapa)
        let attackMode = false;          // true mientras se está eligiendo un ataque
        let attackFrom = null;           // provincia atacante elegida
        let attackTarget = null;         // provincia objetivo elegida en el panel
        let attackTargets = new Set();   // provincias que se pueden atacar desde attackFrom
        let attackSources = new Set();   // provincias propias desde las que se puede atacar
        let pendingAttack = null;        // { attacker, target } del ataque en curso
        let currentQuestionId = null;    // pregunta mostrada ahora mismo
        let answerRevealed = false;      // si ya se ha mostrado su respuesta
        let hoveredProvince = null;

        function isValidTarget(attacker, target) {
            if (!attacker || !target || target === attacker || target.owner === currentPlayerIndex) return false;
            try {
                return turf.booleanIntersects(attacker, target) || areConnectedBySea(attacker, target);
            } catch (e) {
                return false;
            }
        }
        // Solo cuentan las provincias con 2+ tropas que tengan algún enemigo al lado
        function computeAttackSources() {
            attackSources = new Set(provinces.filter(p =>
                p.owner === currentPlayerIndex && p.troops >= 2 && provinces.some(t => isValidTarget(p, t))));
        }
        function canAttackFrom(prov) {
            return attackSources.has(prov);
        }
        function provinceByName(name) {
            return provinces.find(p => p.properties && p.properties.name === name) || null;
        }
        function sortedByName(list) {
            return [...list].sort((a, b) => a.properties.name.localeCompare(b.properties.name, 'es', { sensitivity: 'base' }));
        }

        // Estilo de cada provincia según el estado de la partida
        function provinceStyle(feature) {
            const inGame = !document.body.classList.contains('phase-setup');
            const style = {
                fillColor: (feature.properties && feature.properties.color) || NEUTRAL_FILL,
                weight: 1.4,
                color: '#fbf3df',
                opacity: 0.95,
                fillOpacity: inGame ? 0.7 : 0.3,
                dashArray: null
            };
            if (attackMode) {
                if (feature === attackFrom) {
                    Object.assign(style, { weight: 4, color: '#ffd66b', fillOpacity: 0.88 });
                } else if (feature === attackTarget) {
                    Object.assign(style, { weight: 4.5, color: '#ff6a52', fillOpacity: 0.95 });
                } else if (attackFrom && attackTargets.has(feature)) {
                    Object.assign(style, { weight: 3.5, color: '#ff6a52', fillOpacity: 0.85, dashArray: '7 5' });
                } else if (!attackFrom && canAttackFrom(feature)) {
                    Object.assign(style, { weight: 3, color: '#ffd66b', fillOpacity: 0.8 });
                } else {
                    style.fillOpacity = 0.2;
                    style.opacity = 0.55;
                }
            }
            if (feature === hoveredProvince) {
                style.fillOpacity = Math.min(0.95, style.fillOpacity + 0.15);
                style.weight += 1;
            }
            return style;
        }

        function refreshMap() {
            if (geoJsonLayer) {
                geoJsonLayer.eachLayer(layer => layer.setStyle(provinceStyle(layer.feature)));
            }
            provinces.forEach(prov => {
                const el = prov.troopsLabel && prov.troopsLabel.getElement && prov.troopsLabel.getElement();
                if (!el) return;
                const owner = players[prov.owner];
                el.style.setProperty('--owner', owner ? owner.color : 'var(--gold)');
                const relevant = !attackMode
                    || prov === attackFrom
                    || (attackFrom ? attackTargets.has(prov) : canAttackFrom(prov));
                el.classList.toggle('is-dim', !relevant);
                el.classList.toggle('is-focus', attackMode && (prov === attackFrom || prov === attackTarget || (attackFrom && attackTargets.has(prov))));
            });
        }

        function fillSelect(select, provincesList, placeholder, selected) {
            select.innerHTML = '';
            const first = document.createElement('option');
            first.value = '';
            first.textContent = placeholder;
            select.appendChild(first);
            provincesList.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.properties.name;
                opt.textContent = `${p.properties.name} (${p.troops})`;
                select.appendChild(opt);
            });
            select.value = selected ? selected.properties.name : '';
        }

        // Sincroniza el panel lateral con lo elegido (desde el panel o desde el mapa)
        function renderAttackPanel() {
            const attackerSelect = document.getElementById('attackerProvince');
            const targetSelect = document.getElementById('targetProvince');
            fillSelect(attackerSelect, sortedByName(attackSources), 'Elige provincia…', attackFrom);
            attackerSelect.disabled = attackSources.size === 0;
            if (attackFrom) {
                fillSelect(targetSelect, sortedByName(attackTargets), 'Elige objetivo…', attackTarget);
                targetSelect.disabled = false;
            } else {
                fillSelect(targetSelect, [], 'Primero elige la atacante', null);
                targetSelect.disabled = true;
            }
            document.getElementById('confirmAttack').disabled = !(attackFrom && attackTarget);
            document.getElementById('attackNote').textContent = attackSources.size === 0
                ? 'No tienes provincias con al menos 2 tropas junto a un enemigo.'
                : 'También puedes pulsar las provincias en el mapa.';
        }

        function enterAttackMode() {
            if (!players[currentPlayerIndex]) return;
            attackMode = true;
            attackFrom = null;
            attackTarget = null;
            attackTargets = new Set();
            computeAttackSources();
            document.body.classList.add('attack-mode');
            document.getElementById('attack').setAttribute('aria-pressed', 'true');
            document.getElementById('attackPanel').classList.add('is-visible');
            renderAttackPanel();
            refreshMap();
        }

        function exitAttackMode() {
            attackMode = false;
            attackFrom = null;
            attackTarget = null;
            attackTargets = new Set();
            attackSources = new Set();
            document.body.classList.remove('attack-mode');
            document.getElementById('attack').setAttribute('aria-pressed', 'false');
            document.getElementById('attackPanel').classList.remove('is-visible');
            refreshMap();
        }

        function setAttacker(feature) {
            attackFrom = feature;
            attackTarget = null;
            attackTargets = feature ? new Set(provinces.filter(p => isValidTarget(feature, p))) : new Set();
            renderAttackPanel();
            refreshMap();
        }

        function setTarget(feature) {
            attackTarget = feature;
            renderAttackPanel();
            refreshMap();
        }

        function launchAttack(attacker, target) {
            exitAttackMode();
            pendingAttack = { attacker: attacker, target: target };
            showQuestion(attacker, target);
        }

        // Clic en el mapa: elegir atacante, o lanzar el ataque al pulsar un objetivo válido
        function handleAttackClick(feature) {
            if (canAttackFrom(feature)) {
                setAttacker(feature);
            } else if (attackFrom && attackTargets.has(feature)) {
                launchAttack(attackFrom, feature);
            }
        }

        // Encajar el Imperio en la parte visible del mapa (sin quedar bajo el panel)
        function fitEmpire() {
            if (!geoJsonLayer) return;
            const narrow = window.innerWidth <= 700;
            const inGame = !document.body.classList.contains('phase-setup');
            map.fitBounds(geoJsonLayer.getBounds(), {
                paddingTopLeft: [20, 20],
                paddingBottomRight: narrow ? [20, inGame ? Math.round(window.innerHeight * 0.5) : 20] : [inGame ? 340 : 20, 20]
            });
        }

        function closeQuestionModal() {
            document.getElementById('questionModal').style.display = 'none';
            pendingAttack = null;
        }

        // Inicializar el mapa
        const map = L.map('map', {
            center: [41.9028, 12.4964],
            zoom: 4,
            zoomDelta: 0.1,
            zoomSnap: 0.1,
            wheelPxPerZoomLevel: 75,
            scrollWheelZoom: 'center'
        }).setView([41.9028, 12.4964], 4);

            const tileLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Physical_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: '&copy; Esri, USGS, NOAA',
            maxZoom: 8

        }).addTo(map);

        // Event listener para toggle mapa base
        document.getElementById('toggleMap').addEventListener('click', function() {
            mapBaseVisible = !mapBaseVisible;
            if (mapBaseVisible) {
                if (tileLayer && !map.hasLayer(tileLayer)) map.addLayer(tileLayer);
            } else {
                if (tileLayer && map.hasLayer(tileLayer)) map.removeLayer(tileLayer);
            }
        });

        const startGameButton = document.getElementById('startGame');
        const loadQuestionsButton = document.getElementById('loadQuestionsButton');
        const questionsFileInput = document.getElementById('questionsFileInput');
        const questionsStatus = document.getElementById('questionsStatus');

        function setQuestionsStatus(message, status) {
            if (!questionsStatus) return;
            questionsStatus.textContent = message;
            questionsStatus.className = `questions-status ${status || 'pending'}`;
        }

        function updateStartGameState() {
            if (!startGameButton) return;
            if (loadQuestionsButton) {
                loadQuestionsButton.textContent = questionsReady ? 'Cambiar preguntas' : 'Cargar preguntas';
            }
            if (!questionsReady) {
                startGameButton.disabled = true;
                startGameButton.style.display = 'none';
                startGameButton.textContent = 'Iniciar conquista';
                return;
            }
            startGameButton.style.display = 'flex';
            if (!mapReady) {
                startGameButton.disabled = true;
                startGameButton.textContent = 'Cargando mapa…';
                return;
            }
            startGameButton.disabled = false;
            startGameButton.textContent = 'Iniciar conquista';
        }

        function clearQuestionsState(options) {
            const opts = {
                statusMessage: 'Carga un archivo JSON con preguntas antes de empezar.',
                statusType: 'pending',
                keepStatus: false,
                ...options
            };
            questions = [];
            usedQuestions = [];
            questionsReady = false;
            loadedQuestionsFileName = '';
            if (!opts.keepStatus) {
                setQuestionsStatus(opts.statusMessage, opts.statusType);
            }
            updateStartGameState();
        }

        function normalizeQuestionEntry(entry, index) {
            if (!entry || typeof entry !== 'object' || Array.isArray(entry)) {
                throw new Error(`La pregunta ${index + 1} no tiene un formato válido.`);
            }
            const pregunta = typeof entry.pregunta === 'string' ? entry.pregunta.trim() : '';
            const respuesta = typeof entry.respuesta === 'string' ? entry.respuesta.trim() : '';
            if (!pregunta || !respuesta) {
                throw new Error(`La pregunta ${index + 1} debe incluir "pregunta" y "respuesta" con texto.`);
            }
            const rawId = (typeof entry.id === 'string' || typeof entry.id === 'number')
                ? String(entry.id).trim()
                : '';
            return {
                id: rawId || `pregunta-${index + 1}`,
                pregunta: pregunta,
                respuesta: respuesta
            };
        }

        function normalizeQuestionsData(data) {
            if (!Array.isArray(data)) {
                throw new TypeError('El JSON debe ser un array de objetos con "pregunta" y "respuesta".');
            }
            if (data.length === 0) {
                throw new Error('El archivo JSON no contiene preguntas.');
            }
            const seenIds = new Set();
            return data.map((entry, index) => {
                const normalized = normalizeQuestionEntry(entry, index);
                if (seenIds.has(normalized.id)) {
                    throw new Error(`Hay IDs de pregunta repetidos: ${normalized.id}`);
                }
                seenIds.add(normalized.id);
                return normalized;
            });
        }

        function setQuestionsData(data, options) {
            const opts = { fileName: '', sourceLabel: '', usedIds: [], ...options };
            const normalizedQuestions = normalizeQuestionsData(data);
            const allowedIds = new Set(normalizedQuestions.map(q => q.id));
            const normalizedUsedIds = Array.isArray(opts.usedIds)
                ? [...new Set(opts.usedIds
                    .map(id => String(id).trim())
                    .filter(id => id && allowedIds.has(id)))]
                : [];

            questions = normalizedQuestions;
            usedQuestions = normalizedUsedIds;
            questionsReady = true;
            loadedQuestionsFileName = opts.fileName || '';

            const sourceLabel = opts.sourceLabel || (opts.fileName
                ? `Archivo cargado: ${opts.fileName}`
                : 'Preguntas cargadas');
            const usedSuffix = normalizedUsedIds.length > 0 ? `, ${normalizedUsedIds.length} usadas` : '';

            setQuestionsStatus(`${sourceLabel} (${normalizedQuestions.length} preguntas${usedSuffix}).`, 'ready');
            updateStartGameState();
        }

        function loadQuestionsFromFile(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const parsed = JSON.parse(event.target.result);
                    setQuestionsData(parsed, { fileName: file.name });
                } catch (error) {
                    clearQuestionsState({
                        statusMessage: `No se pudo cargar "${file.name}": ${error.message}`,
                        statusType: 'error'
                    });
                    console.error('Error cargando preguntas:', error);
                }
            };
            reader.onerror = function() {
                clearQuestionsState({
                    statusMessage: `No se pudo leer "${file.name}".`,
                    statusType: 'error'
                });
            };
            reader.readAsText(file, 'utf-8');
        }

        clearQuestionsState();

        // Configuración de uniones
        const unionesConfig = {
            "uniones": [
                {
                    "nombre": "Magna Grecia",
                    "provincias": ["Sicilia", "II", "III"],
                },
                {
                    "nombre": "Italia",
                    "provincias": ["I", "IV", "V","VI", "VII", "VIII", "IX","Sardinia et Corsica"],
                },
                {
                    "nombre": "Narbonensis",
                    "provincias": ["Alpes Cottiae", "Alpes Maritimae", "Alpes Graiae et Poeninae", "Narbonensis"],
                },
                {
                    "nombre": "Moesia",
                    "provincias": ["Moesia Superior", "Moesia Inferior"],
                },
                {
                    "nombre": "Asia",
                    "provincias": ["Lycia et Pamphylia", "Cilicia","Asia", "Galatia et Cappadocia"],
                }, 
                {
                    "nombre": "Mauretania",
                    "provincias": ["Mauretania Caesariensis", "Mauretania Tingitana"],
                },
                {
                    "nombre": "Africa",
                    "provincias": ["Africa Proconsularis", "Numidia"],
                },
                {
                    "nombre":"Iudea",
                    "provincias": ["Iudaea", "Arabia"],
                },
                {
                    "nombre":"Syria",
                    "provincias": ["Syria","Cyprus"],
                },
                {
                    "nombre":"Ponto",
                    "provincias":"Bithynia et Pontus"
                },
                {
                    "nombre":"Armenia",
                    "provincias":"Armenia Mesopotamia"
                },
                {
                    "nombre":"Graecia",
                    "provincias":"Achaia"
                },
                {
                    "nombre":"Pannonia",
                    "provincias":["Pannonia Superior","Pannonia Inferior"]
                },
                {
                    "nombre":"Gallia cisalpina",
                    "provincias":["X","XI"]
                },
                {
                    "nombre":"Raetia",
                    "provincias":["Raetia","Noricum"]
                },
                {
                    "nombre":"Germania",
                    "provincias":["Germania Inferior","Germania Superior"]
                },
                {
                    "nombre":"Gallia",
                    "provincias":["Aquitania","Lugdunensis"]
                },
                {
                    "nombre":"Cyrenaica",
                    "provincias":["Creta et Cyrene"]
                }
            ]
        };

        // Cargar GeoJSON
        fetch('https://raw.githubusercontent.com/klokantech/roman-empire/master/data/provinces.geojson')
            .then(response => response.json())
            .then(data => {

                // Procesar uniones
                const todasProvinciasAUnir = [];
                const unionesMerged = [];
                // Normalizar nombres y evitar duplicados
                function normalizeName(n) {
                    return (n || '').toString().trim().toLowerCase();
                }
                // Offsets manuales por provincia (en píxeles: [x, y])
                const labelOffsets = {
                    'Ponto': [0, 25],
                    'Cyrenaica': [40, -15],
                    'Lusitania': [0, 25],
                    'Baetica': [0, 25],
                    'Iudea' : [0, 50],
                    'Moesia': [40, 10],
                    'Dacia': [0, 35],
                    'Macedonia': [30, 30],
                    'Thracia': [20, 20],
                    'Pannonia': [20, 30],
                    'Gallia cisalpina': [35, 20],
                    'Raetia': [20, 20],
                    'Belgica': [30, 30],
                    'Germania': [-20, 20],
                    'Narbonensis': [10, 30],
                    'Asia': [0, 30],
                };
                // Crear un mapa con claves normalizadas para coincidir con `normalizeName`
                const normalizedLabelOffsets = {};
                Object.keys(labelOffsets).forEach(k => {
                    normalizedLabelOffsets[normalizeName(k)] = labelOffsets[k];
                });
                let labelsCreated = new Set();  // nombres normalizados ya etiquetados
                let createdPositions = new Set();  // Para evitar etiquetas en posiciones muy cercanas

                unionesConfig.uniones.forEach(union => {
                    // Encontrar features originales a unir
                    const featsAUnir = data.features.filter(f => 
                        union.provincias.includes(f.properties.name));

                    if (featsAUnir.length === 0) return; // Saltar si no hay provincias

                    // Guardar nombres originales antes de cualquier transformación (normalizados)
                    const namesToUnir = featsAUnir.map(f => f.properties.name);
                    const namesToUnirNorm = namesToUnir.map(n => normalizeName(n));

                    // Aplicar un buffer pequeño a cada feature para cerrar gaps, preservando properties
                    const featsBuffered = featsAUnir.map(f => {
                        try {
                            const b = turf.buffer(f, 0.002, { units: 'degrees' });
                            // Asegurar que las properties originales se mantengan
                            b.properties = Object.assign({}, f.properties || {});
                            return b;
                        } catch (e) {
                            console.error(`Error aplicando buffer a ${f.properties && f.properties.name}:`, e);
                            return f;
                        }
                    });

                    // Unir las geometrías buffered
                    let merged = featsBuffered[0];
                    for (let i = 1; i < featsBuffered.length; i++) {
                        try {
                            merged = turf.union(merged, featsBuffered[i]);
                        } catch (e) {
                            console.error(`Error uniendo geometrías de ${union.nombre}:`, e);
                        }
                    }

                    // Limpiar la geometría fusionada para remover discontinuidades
                    try {
                        if (typeof turf.clean === 'function') {
                            merged = turf.clean(merged);
                        } else if (typeof turf.simplify === 'function') {
                            // fallback: simplificar ligeramente para eliminar pequeñas discontinuidades
                            try {
                                merged = turf.simplify(merged, { tolerance: 0.00005, highQuality: false });
                            } catch (se) {
                                // si simplify falla, mantener merged tal cual
                            }
                        }
                    } catch (e) {
                        console.error(`Error limpiando geometría de ${union.nombre}:`, e);
                    }

                    // Asignar nombre de la unión
                    merged.properties = { 
                        name: union.nombre
                    };

                    unionesMerged.push(merged);
                    // Usar los nombres originales para eliminar las features individuales (normalizados)
                    todasProvinciasAUnir.push(...namesToUnirNorm);
                });
                // Filtrar features originales comprobando nombres normalizados
                data.features = data.features.filter(f => {
                    const nameNorm = normalizeName(f.properties && f.properties.name);
                    return !todasProvinciasAUnir.includes(nameNorm);
                });
                
                data.features.push(...unionesMerged);

                // Agrupar features por nombre normalizado para asegurar UNA feature/etiqueta por provincia
                const grouped = {};
                data.features.forEach(f => {
                    const name = (f.properties && f.properties.name) || '';
                    const key = normalizeName(name) || `__unnamed_${Math.random().toString(36).slice(2,8)}`;
                    if (!grouped[key]) grouped[key] = { nameOriginal: name, features: [] };
                    grouped[key].features.push(f);
                });

                const newFeatures = [];
                Object.keys(grouped).forEach(key => {
                    const g = grouped[key];
                    if (g.features.length === 1) {
                        // usar la feature tal cual
                        newFeatures.push(g.features[0]);
                    } else {
                        // unir las partes en una sola geometría
                        let mergedPart = g.features[0];
                        for (let i = 1; i < g.features.length; i++) {
                            try {
                                mergedPart = turf.union(mergedPart, g.features[i]);
                            } catch (e) {
                                console.error(`Error uniendo partes de ${g.nameOriginal}:`, e);
                            }
                        }
                        try { mergedPart = turf.clean(mergedPart); } catch (e) { /* ignore */ }
                        mergedPart.properties = Object.assign({}, g.features[0].properties || {});
                        mergedPart.properties.name = g.nameOriginal;
                        newFeatures.push(mergedPart);
                    }
                });

                data.features = newFeatures;

                // Crear capa GeoJSON
                let provinceIndex = {};
                geoJsonLayer = L.geoJSON(data, {
                    style: provinceStyle,
                    onEachFeature: function(feature, layer) {
                        const nameNorm = normalizeName(feature.properties && feature.properties.name);
                        if (nameNorm && labelsCreated.has(nameNorm)) return;  // Evitar duplicados por nombre
                        // Mejorar posicionamiento: elegir el punto más central posible sin salir del polígono
                        let coords;
                        const centroid = turf.centroid(feature);
                        const pointOn = turf.pointOnFeature(feature);
                        // Si el centroide está dentro, preferirlo (más central)
                        if (turf.booleanPointInPolygon(centroid, feature)) {
                            coords = centroid.geometry.coordinates;
                        } else {
                            // Intentar interpolar desde pointOn hacia centroid sin salir del polígono
                            const base = pointOn.geometry.coordinates;
                            const target = centroid.geometry.coordinates;
                            const factors = [0.35, 0.25, 0.15, 0.08, 0.0];
                            let chosen = base;
                            for (let f of factors) {
                                const cand = [base[0] + (target[0] - base[0]) * f, base[1] + (target[1] - base[1]) * f];
                                const candPt = turf.point(cand);
                                if (turf.booleanPointInPolygon(candPt, feature)) {
                                    chosen = cand;
                                    break;
                                }
                            }
                            coords = chosen;
                        }
                        const posKey = `${Math.round(coords[0] * 1000)}-${Math.round(coords[1] * 1000)}`;
                        if (createdPositions.has(posKey)) return;  // Evitar posiciones muy cercanas
                        // Etiqueta de tropas
                        // Aplicar offset manual si existe para esta provincia (usar claves normalizadas)
                        let anchor = [0, 0];
                        if (nameNorm && normalizedLabelOffsets[nameNorm]) {
                            anchor = normalizedLabelOffsets[nameNorm];
                        }
                        feature.troopsLabel = L.marker([coords[1], coords[0]], {
                            icon: L.divIcon({
                                className: 'troops-label',
                                html: `<div>4</div>`,
                                iconAnchor: anchor
                            })
                        }).addTo(map);
                        if (nameNorm) labelsCreated.add(nameNorm);
                        createdPositions.add(posKey);

                        layer.on({
                            mouseover: function(e) {
                                hoveredProvince = feature;
                                e.target.setStyle(provinceStyle(feature));
                            },
                            mouseout: function(e) {
                                if (hoveredProvince === feature) hoveredProvince = null;
                                e.target.setStyle(provinceStyle(feature));
                            },
                            click: function(e) {
                                if (document.body.classList.contains('phase-setup')) return;
                                if (attackMode) {
                                    handleAttackClick(feature);
                                    return;
                                }
                                selectedProvince = feature;
                                document.getElementById('troopsModal').style.display = 'flex';
                                document.getElementById('selectedProvince').textContent = feature.properties.name;
                                document.getElementById('currentTroops').textContent = feature.troops || 4;
                            }
                        });

                        try {
                            feature._centroidCoords = centroid.geometry.coordinates;
                            feature._pointOnCoords = pointOn.geometry.coordinates;
                        } catch(e) {}
                        provinces.push(feature);
                        try { if (nameNorm) provinceIndex[nameNorm] = feature; } catch(e) {}
                    }
                }).addTo(map);
                fitEmpire();

                mapReady = true;
                updateStartGameState();

                // Conexiones marítimas / puentes entre provincias (ataques permitidos a distancia)
                const seaConnections = [
                    ['Britannia', 'Gallia'],
                    ['Britannia', 'Belgica'],
                    ['Magna Grecia', 'Africa'],
                    ['Magna Grecia', 'Cyrenaica'],
                    ['Baetica', 'Mauretania'],
                    ['Graecia', 'Asia']
                ];

                // Construir mapa bidireccional de conexiones normalizadas (usar la variable externa)
                connectionsMap = {};
                function addConnection(a, b) {
                    const na = normalizeName(a);
                    const nb = normalizeName(b);
                    connectionsMap[na] = connectionsMap[na] || new Set();
                    connectionsMap[nb] = connectionsMap[nb] || new Set();
                    connectionsMap[na].add(nb);
                    connectionsMap[nb].add(na);
                }
                seaConnections.forEach(pair => addConnection(pair[0], pair[1]));
                // almacenar globalmente y dibujar (usar drawAllSeaConnections para soportar overrides)
                seaConnectionsGlobal = seaConnections.map(p => [p[0], p[1]]);
                function clearSeaPolylines() {
                    seaPolylineLayers.forEach(l => { try { map.removeLayer(l); } catch (e) {} });
                    seaPolylineLayers = [];
                }

                function drawAllSeaConnections() {
                    clearSeaPolylines();
                    seaConnectionsGlobal.forEach(pair => {
                        const aName = pair[0];
                        const bName = pair[1];
                        const a = findProvinceByNameLoose(aName);
                        const b = findProvinceByNameLoose(bName);
                        if (!a || !b) {
                            console.warn('Conexión marítima: provincia no encontrada', pair);
                            return;
                        }
                        // comprobar si existe override manual
                        const key = normalizeName(aName) + '|' + normalizeName(bName);
                        const cfg = seaEndpointOffsetsConfig[key];
                        const endpoints = cfg ? {
                            a: [cfg.a[1], cfg.a[0]], // convertir [lat,lng] (config) -> [lon,lat]
                            b: [cfg.b[1], cfg.b[0]]
                        } : undefined;
                        const pl = createCurvedSeaPolyline(a, b, { endpoints: endpoints });
                        if (pl) seaPolylineLayers.push(pl);
                    });
                }

                // Helper para buscar provincia por nombre (tolerante a pequeñas variaciones)
                function findProvinceByNameLoose(name) {
                    const target = normalizeName(name);
                    return provinces.find(p => {
                        const pn = normalizeName(p.properties && p.properties.name);
                        return pn === target || pn.includes(target) || target.includes(pn);
                    });
                }

                // Helper: escapar para RegExp
                function escapeRegExp(s) {
                    return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                }

                // Mejorar búsqueda tolerante de nombres para evitar emparejamientos parciales indeseados
                function findProvinceByNameLoose(name) {
                    const target = normalizeName(name);
                    if (!target) return null;
                    // 0) lookup rápido por índice si existe
                    try {
                        if (typeof provinceIndex === 'object' && provinceIndex[target]) return provinceIndex[target];
                    } catch (e) { /* ignore */ }
                    // 1) buscar igualdad exacta
                    let exact = provinces.find(p => normalizeName(p.properties && p.properties.name) === target);
                    if (exact) return exact;
                    // 2) buscar coincidencia por token (palabra completa)
                    const targetTokens = target.split(/\s+/).filter(Boolean);
                    for (let p of provinces) {
                        const pn = normalizeName(p.properties && p.properties.name);
                        const pTokens = pn.split(/\s+/).filter(Boolean);
                        // si alguno de los tokens coincide exactamente con el target
                        if (pTokens.includes(target)) return p;
                        // o si el target es exactamente uno de los tokens del nombre de la provincia
                        if (targetTokens.includes(pn)) return p;
                        // o coincidencia de palabra completa usando regex
                        try {
                            const re = new RegExp('\\b' + escapeRegExp(target) + '\\b');
                            if (re.test(pn)) return p;
                        } catch (e) { /* ignore regex errors */ }
                    }
                    // 3) fallback a búsqueda por inclusión antigua (lo último)
                    return provinces.find(p => {
                        const pn = normalizeName(p.properties && p.properties.name);
                        return pn === target || pn.includes(target) || target.includes(pn);
                    }) || null;
                }

                // Crear una polilínea curva (3 puntos) intentando evitar cruzar tierra
                function createCurvedSeaPolyline(aFeature, bFeature, options) {
                    options = options || {};
                    // permitir endpoints manuales: opciones.endpoints = { a: [lon,lat], b: [lon,lat] }
                    let pa, pb;
                    if (options.endpoints && options.endpoints.a && options.endpoints.b) {
                        pa = options.endpoints.a;
                        pb = options.endpoints.b;
                    } else {
                        pa = turf.pointOnFeature(aFeature).geometry.coordinates; // [lon, lat]
                        pb = turf.pointOnFeature(bFeature).geometry.coordinates;
                    }
                    const straight = turf.lineString([pa, pb]);

                    // comprobar si la línea cruza tierra distinta a las dos provincias
                    // Usar muestreo de puntos a lo largo de la línea y verificar punto-a-polígono
                    function lineCrossesLand(line) {
                        try {
                            const na = normalizeName(aFeature.properties && aFeature.properties.name);
                            const nb = normalizeName(bFeature.properties && bFeature.properties.name);
                            // longitud en km
                            const lineLen = (turf.length || turf.lineDistance) ? turf.length(line, { units: 'kilometers' }) : 0;
                            const samples = 16; // número de puntos a muestrear
                            for (let i = 1; i < samples; i++) {
                                const dist = (lineLen * i) / samples;
                                let pt;
                                try {
                                    pt = turf.along(line, dist, { units: 'kilometers' });
                                } catch (e) {
                                    // fallback sencillo: tomar punto interpolado
                                    const coords = line.geometry.coordinates;
                                    const t = i / samples;
                                    const x = coords[0][0] + (coords[coords.length - 1][0] - coords[0][0]) * t;
                                    const y = coords[0][1] + (coords[coords.length - 1][1] - coords[0][1]) * t;
                                    pt = turf.point([x, y]);
                                }
                                // Verificar si el punto cae dentro de alguna provincia distinta a las dos
                                for (let p of provinces) {
                                    const pn = normalizeName(p.properties && p.properties.name);
                                    if (pn === na || pn === nb) continue;
                                    try {
                                        if (turf.booleanPointInPolygon(pt, p)) return true;
                                    } catch (e) {
                                        // ignore
                                    }
                                }
                            }
                        } catch (e) {
                            // en caso de error conservador: decir que sí cruza tierra
                            return true;
                        }
                        return false;
                    }

                    if (!lineCrossesLand(straight)) {
                        // no cruza tierra: dibujar línea recta
                        const latlngs = [[pa[1], pa[0]], [pb[1], pb[0]]];
                        const poly = L.polyline(latlngs, Object.assign({ color: '#f3dea0', weight: 2.5, opacity: 0.9, dashArray: '8,6' }, options)).addTo(map);
                        return poly;
                    }

                    // cálculo de punto medio y vector perpendicular
                    const mid = [(pa[0] + pb[0]) / 2, (pa[1] + pb[1]) / 2];
                    const dx = pb[0] - pa[0];
                    const dy = pb[1] - pa[1];
                    const len = Math.sqrt(dx * dx + dy * dy) || 1;
                    const ux = -dy / len;
                    const uy = dx / len;

                    // distancia en km entre puntos
                    let distKm = 0;
                    try { distKm = turf.distance(turf.point(pa), turf.point(pb), { units: 'kilometers' }); } catch (e) { distKm = 100; }
                    const baseOffsetKm = Math.max(20, distKm * 0.12);

                    // probar desplazamientos crecientes en ambos lados hasta que la curva no cruce tierra
                    for (let sign of [1, -1]) {
                        for (let k = 1; k <= 6; k++) {
                            const offsetKm = baseOffsetKm * k;
                            const degOffset = offsetKm / 111; // aproximación km -> grados
                            const midOffset = [mid[0] + ux * degOffset * sign, mid[1] + uy * degOffset * sign];
                            const candidate = turf.lineString([pa, midOffset, pb]);
                            if (!lineCrossesLand(candidate)) {
                                const latlngs = [[pa[1], pa[0]], [midOffset[1], midOffset[0]], [pb[1], pb[0]]];
                                const poly = L.polyline(latlngs, Object.assign({ color: '#f3dea0', weight: 2.5, opacity: 0.95, dashArray: '8,6', smoothFactor: 1 }, options)).addTo(map);
                                return poly;
                            }
                        }
                    }

                    // si todo falla, regresar a línea recta como último recurso
                    const latlngs = [[pa[1], pa[0]], [pb[1], pb[0]]];
                    const poly = L.polyline(latlngs, Object.assign({ color: '#f3dea0', weight: 2.5, opacity: 0.9, dashArray: '8,6' }, options)).addTo(map);
                    return poly;
                }

                // Dibujar conexiones (usar la función global de dibujo para soportar overrides)
                drawAllSeaConnections();

                // Exponer función que comprueba si dos provincias están conectadas por mar
                areConnectedBySea = function(aFeature, bFeature) {
                    if (!aFeature || !bFeature) return false;
                    const na = normalizeName(aFeature.properties && aFeature.properties.name);
                    const nb = normalizeName(bFeature.properties && bFeature.properties.name);
                    return (connectionsMap[na] && connectionsMap[na].has(nb));
                };
            })
            .catch(error => {
                console.error('Error cargando GeoJSON:', error);
                if (startGameButton) {
                    startGameButton.disabled = true;
                    startGameButton.textContent = 'ERROR CARGANDO MAPA';
                }
            });

        // Configuración inicial
        if (loadQuestionsButton && questionsFileInput) {
            loadQuestionsButton.addEventListener('click', function() {
                questionsFileInput.click();
            });

            questionsFileInput.addEventListener('change', function() {
                const file = this.files && this.files[0];
                if (file) loadQuestionsFromFile(file);
                this.value = '';
            });
        }

        document.getElementById('numPlayers').addEventListener('change', function() {
            const num = parseInt(this.value);
            const playersDiv = document.getElementById('players');
            playersDiv.innerHTML = '';
            const frag = document.createDocumentFragment();
            const teamNames = ['Equipo rojo', 'Equipo azul', 'Equipo verde', 'Equipo púrpura'];
            for (let i = 0; i < num; i++) {
                const color = fixedColors[i] || '#CCCCCC';
                const entry = document.createElement('label');
                entry.className = 'player-entry';

                const swatch = document.createElement('span');
                swatch.className = 'player-swatch';
                swatch.style.background = color;

                const input = document.createElement('input');
                input.type = 'text';
                input.id = `player${i}Name`;
                input.value = teamNames[i] || `Jugador ${i+1}`;
                input.setAttribute('aria-label', `Nombre del equipo ${i+1}`);

                entry.appendChild(swatch);
                entry.appendChild(input);
                frag.appendChild(entry);
            }
            playersDiv.appendChild(frag);
            document.querySelectorAll('.segmented [data-players]').forEach(btn => {
                btn.setAttribute('aria-pressed', String(btn.dataset.players === this.value));

        document.querySelectorAll('.segmented [data-players]').forEach(btn => {

                select.dispatchEvent(new Event('change'));

        document.getElementById('numPlayers').value = '4';
        document.getElementById('numPlayers').dispatchEvent(new Event('change'));

        // Enlace al editor: en GitHub Pages está en /editor/, en local es el archivo HTML
        if (location.protocol.startsWith('http')) {
            document.getElementById('editorLink').href = 'editor/';
        }

        // Preguntas de ejemplo (solo disponibles cuando el juego se sirve por web)
        document.getElementById('sampleQuestionsBtn').addEventListener('click', function() {
            setQuestionsStatus('Cargando preguntas de ejemplo…', 'pending');
            fetch('ejemplos/preguntas-roma.json')
                .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
                .then(data => setQuestionsData(data, { sourceLabel: 'Preguntas de ejemplo sobre Roma' }))
                .catch(err => {
                    console.error('Error cargando preguntas de ejemplo:', err);
                    setQuestionsStatus('No se pudieron cargar las preguntas de ejemplo. Abre el juego desde la web o carga ejemplos/preguntas-roma.json con "Cargar preguntas".', 'error');
                });

        // Mostrar el panel de configuración centrado al cargar
        document.getElementById('gameUI').classList.add('centered-setup');

        document.getElementById('startGame').addEventListener('click', function() {
            if (!mapReady) {
                alert('El mapa todavía se está cargando. Espera un momento antes de iniciar la partida.');
                return;
            }
            if (!questionsReady || questions.length === 0) {
                alert('Carga un archivo JSON de preguntas antes de iniciar la partida.');
                return;
            }
            const num = Number.parseInt(document.getElementById('numPlayers').value);
            players = [];
            for (let i = 0; i < num; i++) {
                players.push({
                    name: document.getElementById(`player${i}Name`).value.trim() || `Equipo ${i+1}`,
                    color: fixedColors[i] || '#000000',
                    provinces: []
                });
            }
            assignProvinces();
            document.body.classList.remove('phase-setup');
            fitEmpire();
            // Quitar estilo centrado y volver a la barra lateral para el juego
            document.getElementById('gameUI').classList.remove('centered-setup');
            document.getElementById('setup').style.display = 'none';
            document.getElementById('game').style.display = 'block';
            updateUI();
        });

        // Interfaz de edición manual de conexiones eliminada: use `seaEndpointOffsetsConfig` para configurar endpoints manuales.

        function assignProvinces() {
            const numPlayers = players.length;
            const shuffled = [...provinces].sort(() => Math.random() - 0.5);
            shuffled.forEach((prov, index) => {
                const playerIndex = index % numPlayers;
                prov.owner = playerIndex;
                prov.troops = 3;
                players[playerIndex].provinces.push(prov);
                prov.properties.color = players[playerIndex].color;
                geoJsonLayer.eachLayer(layer => {
                    if (layer.feature === prov) {
                        layer.setStyle({ fillColor: players[playerIndex].color });
                    }
                });
                prov.troopsLabel.getElement().innerHTML = `<div>${prov.troops}</div>`;
            });
        }

        function updateUI() {
            const current = players[currentPlayerIndex];
            document.getElementById('currentPlayer').textContent = current.name;
            document.getElementById('turnChip').style.setProperty('--turn-color', current.color);
            // Actualizar lista de jugadores
            const playersListDiv = document.getElementById('playersList');
            playersListDiv.innerHTML = '';
            const frag = document.createDocumentFragment();
            const title = document.createElement('div');
            title.className = 'players-title';
            title.innerHTML = '<p class="eyebrow">Equipos</p><p class="eyebrow" style="color:var(--muted)">Prov. · Tropas</p>';
            frag.appendChild(title);
            const totalProvinces = provinces.length || 1;
            players.forEach((player, index) => {
                const numProvinces = player.provinces.length;
                const totalTroops = player.provinces.reduce((sum, prov) => sum + prov.troops, 0);
                const item = document.createElement('div');
                item.className = 'player-info' + (index === currentPlayerIndex ? ' is-current' : '');
                const colorBox = document.createElement('span');
                colorBox.className = 'player-color';
                colorBox.style.backgroundColor = player.color;
                const name = document.createElement('span');
                name.className = 'player-name';
                name.textContent = player.name;
                const stats = document.createElement('span');
                stats.className = 'player-stats';
                stats.innerHTML = `<b>${numProvinces}</b> · <b>${totalTroops}</b>`;
                const bar = document.createElement('span');
                bar.className = 'player-bar';
                const fill = document.createElement('i');
                fill.style.width = `${Math.round(numProvinces / totalProvinces * 100)}%`;
                fill.style.background = player.color;
                bar.appendChild(fill);
                item.append(colorBox, name, stats, bar);
                frag.appendChild(item);
            });
            playersListDiv.appendChild(frag);
            const left = questions.length - usedQuestions.length;
            document.getElementById('questionsLeft').textContent = `Quedan ${left} de ${questions.length} preguntas`;
            refreshMap();
            checkVictory();
        }

        function checkVictory() {
            // No comprobar victoria si las provincias no se han cargado aún
            if (!provinces || provinces.length === 0) return;
            for (let player of players) {
                if (player.provinces.length === provinces.length) {
                    showVictory(player, `${player.name} gana la partida!`);
                    return;
                }
            }
            if (questionsReady && questions.length > 0 && questions.length === usedQuestions.length) {
                let maxTroops = 0;
                let winner = null;
                players.forEach(player => {
                    const totalTroops = player.provinces.reduce((sum, prov) => sum + prov.troops, 0);
                    if (totalTroops > maxTroops) {
                        maxTroops = totalTroops;
                        winner = player;
                    }
                });
                showVictory(winner, `${winner.name} gana la partida con ${maxTroops} tropas!`);
            }
        }

        // Modificar tropas (proteger en caso de que el botón no exista en el DOM)
        const modifyBtn = document.getElementById('modifyTroops');
        if (modifyBtn) {

                }

            if (selectedProvince.troops < 99) { // límite arbitrario
