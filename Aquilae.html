        const startGameButton = document.getElementById('startGame');
        const loadQuestionsButton = document.getElementById('loadQuestionsButton');
        const questionsFileInput = document.getElementById('questionsFileInput');
        const questionsStatus = document.getElementById('questionsStatus');

        function setQuestionsStatus(message, status) {
            if (!questionsStatus) return;
            questionsStatus.textContent = message;
            questionsStatus.className = `questions-status ${status || 'pending'}`;
        }

        function updateStartGameState() {
            if (!startGameButton) return;
            if (loadQuestionsButton) {
                loadQuestionsButton.textContent = questionsReady ? 'Cambiar preguntas' : 'Cargar preguntas';
            }
            if (!questionsReady) {
                startGameButton.disabled = true;
                startGameButton.style.display = 'none';
                startGameButton.textContent = '⚔️ INICIAR CONQUISTA ⚔️';
                return;
            }
            startGameButton.style.display = 'inline-block';
            if (!mapReady) {
                startGameButton.disabled = true;
                startGameButton.textContent = 'CARGANDO MAPA...';
                return;
            }
            startGameButton.disabled = false;
            startGameButton.textContent = '⚔️ INICIAR CONQUISTA ⚔️';
        }

        function clearQuestionsState(options) {
            const opts = {
                statusMessage: 'Carga un archivo JSON con preguntas antes de empezar.',
                statusType: 'pending',
                keepStatus: false,
                ...options
            };
            questions = [];
            usedQuestions = [];
            questionsReady = false;
            loadedQuestionsFileName = '';
            if (!opts.keepStatus) {
                setQuestionsStatus(opts.statusMessage, opts.statusType);
            }
            updateStartGameState();
        }

        function normalizeQuestionEntry(entry, index) {
            if (!entry || typeof entry !== 'object' || Array.isArray(entry)) {
                throw new Error(`La pregunta ${index + 1} no tiene un formato válido.`);
            }
            const pregunta = typeof entry.pregunta === 'string' ? entry.pregunta.trim() : '';
            const respuesta = typeof entry.respuesta === 'string' ? entry.respuesta.trim() : '';
            if (!pregunta || !respuesta) {
                throw new Error(`La pregunta ${index + 1} debe incluir "pregunta" y "respuesta" con texto.`);
            }
            const rawId = (typeof entry.id === 'string' || typeof entry.id === 'number')
                ? String(entry.id).trim()
                : '';
            return {
                id: rawId || `pregunta-${index + 1}`,
                pregunta: pregunta,
                respuesta: respuesta
            };
        }

        function normalizeQuestionsData(data) {
            if (!Array.isArray(data)) {
                throw new TypeError('El JSON debe ser un array de objetos con "pregunta" y "respuesta".');
            }
            if (data.length === 0) {
                throw new Error('El archivo JSON no contiene preguntas.');
            }
            const seenIds = new Set();
            return data.map((entry, index) => {
                const normalized = normalizeQuestionEntry(entry, index);
                if (seenIds.has(normalized.id)) {
                    throw new Error(`Hay IDs de pregunta repetidos: ${normalized.id}`);
                }
                seenIds.add(normalized.id);
                return normalized;
            });
        }

        function setQuestionsData(data, options) {
            const opts = { fileName: '', sourceLabel: '', usedIds: [], ...options };
            const normalizedQuestions = normalizeQuestionsData(data);
            const allowedIds = new Set(normalizedQuestions.map(q => q.id));
            const normalizedUsedIds = Array.isArray(opts.usedIds)
                ? [...new Set(opts.usedIds
                    .map(id => String(id).trim())
                    .filter(id => id && allowedIds.has(id)))]
                : [];

            questions = normalizedQuestions;
            usedQuestions = normalizedUsedIds;
            questionsReady = true;
            loadedQuestionsFileName = opts.fileName || '';

            const sourceLabel = opts.sourceLabel || (opts.fileName
                ? `Archivo cargado: ${opts.fileName}`
                : 'Preguntas cargadas');
            const usedSuffix = normalizedUsedIds.length > 0 ? `, ${normalizedUsedIds.length} usadas` : '';

            setQuestionsStatus(`${sourceLabel} (${normalizedQuestions.length} preguntas${usedSuffix}).`, 'ready');
            updateStartGameState();
        }

        function loadQuestionsFromFile(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const parsed = JSON.parse(event.target.result);
                    setQuestionsData(parsed, { fileName: file.name });
                } catch (error) {
                    clearQuestionsState({
                        statusMessage: `No se pudo cargar "${file.name}": ${error.message}`,
                        statusType: 'error'
                    });
                    console.error('Error cargando preguntas:', error);
                }
            };
            reader.onerror = function() {
                clearQuestionsState({
                    statusMessage: `No se pudo leer "${file.name}".`,
                    statusType: 'error'
                });
            };
            reader.readAsText(file, 'utf-8');
        }

        clearQuestionsState();

        // Configuración de uniones
        const unionesConfig = {
            "uniones": [
                {
                    "nombre": "Magna Grecia",
                    "provincias": ["Sicilia", "II", "III"],
                },
                {
                    "nombre": "Italia",
                    "provincias": ["I", "IV", "V","VI", "VII", "VIII", "IX","Sardinia et Corsica"],
                },
                {
                    "nombre": "Narbonensis",
                    "provincias": ["Alpes Cottiae", "Alpes Maritimae", "Alpes Graiae et Poeninae", "Narbonensis"],
                },
                {
                    "nombre": "Moesia",
                    "provincias": ["Moesia Superior", "Moesia Inferior"],
                },
                {
                    "nombre": "Asia",
                    "provincias": ["Lycia et Pamphylia", "Cilicia","Asia", "Galatia et Cappadocia"],
                }, 
                {
                    "nombre": "Mauretania",
                    "provincias": ["Mauretania Caesariensis", "Mauretania Tingitana"],
                },
                {
                    "nombre": "Africa",
                    "provincias": ["Africa Proconsularis", "Numidia"],
                },
                {
                    "nombre":"Iudea",
                    "provincias": ["Iudaea", "Arabia"],
                },
                {
                    "nombre":"Syria",
                    "provincias": ["Syria","Cyprus"],
                },
                {
                    "nombre":"Ponto",
                    "provincias":"Bithynia et Pontus"
                },
                {
                    "nombre":"Armenia",
                    "provincias":"Armenia Mesopotamia"
                },
                {
                    "nombre":"Graecia",
                    "provincias":"Achaia"
                },
                {
                    "nombre":"Pannonia",
                    "provincias":["Pannonia Superior","Pannonia Inferior"]
                },
                {
                    "nombre":"Gallia cisalpina",
                    "provincias":["X","XI"]
                },
                {
                    "nombre":"Raetia",
                    "provincias":["Raetia","Noricum"]
                },
                {
                    "nombre":"Germania",
                    "provincias":["Germania Inferior","Germania Superior"]
                },
                {
                    "nombre":"Gallia",
                    "provincias":["Aquitania","Lugdunensis"]
                },
                {
                    "nombre":"Cyrenaica",
                    "provincias":["Creta et Cyrene"]
                }
            ]
        };

        // Cargar GeoJSON
        fetch('https://raw.githubusercontent.com/klokantech/roman-empire/master/data/provinces.geojson')
            .then(response => response.json())
            .then(data => {

                // Procesar uniones
                const todasProvinciasAUnir = [];
                const unionesMerged = [];
                // Normalizar nombres y evitar duplicados
                function normalizeName(n) {
                    return (n || '').toString().trim().toLowerCase();
                }
                // Offsets manuales por provincia (en píxeles: [x, y])
                const labelOffsets = {
                    'Ponto': [0, 25],
                    'Cyrenaica': [40, -15],
                    'Lusitania': [0, 25],
                    'Baetica': [0, 25],
                    'Iudea' : [0, 50],
                    'Moesia': [40, 10],
                    'Dacia': [0, 35],
                    'Macedonia': [30, 30],
                    'Thracia': [20, 20],
                    'Pannonia': [20, 30],
                    'Gallia cisalpina': [35, 20],
                    'Raetia': [20, 20],
                    'Belgica': [30, 30],
                    'Germania': [-20, 20],
                    'Narbonensis': [10, 30],
                    'Asia': [0, 30],
                };
                // Crear un mapa con claves normalizadas para coincidir con `normalizeName`
                const normalizedLabelOffsets = {};
                Object.keys(labelOffsets).forEach(k => {
                    normalizedLabelOffsets[normalizeName(k)] = labelOffsets[k];
                });
                let labelsCreated = new Set();  // nombres normalizados ya etiquetados
                let createdPositions = new Set();  // Para evitar etiquetas en posiciones muy cercanas

                unionesConfig.uniones.forEach(union => {
                    // Encontrar features originales a unir
                    const featsAUnir = data.features.filter(f => 
                        union.provincias.includes(f.properties.name));

                    if (featsAUnir.length === 0) return; // Saltar si no hay provincias

                    // Guardar nombres originales antes de cualquier transformación (normalizados)
                    const namesToUnir = featsAUnir.map(f => f.properties.name);
                    const namesToUnirNorm = namesToUnir.map(n => normalizeName(n));

                    // Aplicar un buffer pequeño a cada feature para cerrar gaps, preservando properties
                    const featsBuffered = featsAUnir.map(f => {
                        try {
                            const b = turf.buffer(f, 0.002, { units: 'degrees' });
                            // Asegurar que las properties originales se mantengan
                            b.properties = Object.assign({}, f.properties || {});
                            return b;
                        } catch (e) {
                            console.error(`Error aplicando buffer a ${f.properties && f.properties.name}:`, e);
                            return f;
                        }
                    });

                    // Unir las geometrías buffered
                    let merged = featsBuffered[0];
                    for (let i = 1; i < featsBuffered.length; i++) {
                        try {
                            merged = turf.union(merged, featsBuffered[i]);
                        } catch (e) {
                            console.error(`Error uniendo geometrías de ${union.nombre}:`, e);
                        }
                    }

                    // Limpiar la geometría fusionada para remover discontinuidades
                    try {
                        if (typeof turf.clean === 'function') {
                            merged = turf.clean(merged);
                        } else if (typeof turf.simplify === 'function') {
                            // fallback: simplificar ligeramente para eliminar pequeñas discontinuidades
                            try {
                                merged = turf.simplify(merged, { tolerance: 0.00005, highQuality: false });
                            } catch (se) {
                                // si simplify falla, mantener merged tal cual
                            }
                        }
                    } catch (e) {
                        console.error(`Error limpiando geometría de ${union.nombre}:`, e);
                    }

                    // Asignar nombre de la unión
                    merged.properties = { 
                        name: union.nombre
                    };

                    unionesMerged.push(merged);
                    // Usar los nombres originales para eliminar las features individuales (normalizados)
                    todasProvinciasAUnir.push(...namesToUnirNorm);
                });
                // Filtrar features originales comprobando nombres normalizados
                data.features = data.features.filter(f => {
                    const nameNorm = normalizeName(f.properties && f.properties.name);
                    return !todasProvinciasAUnir.includes(nameNorm);
                });
                
                data.features.push(...unionesMerged);

                // Agrupar features por nombre normalizado para asegurar UNA feature/etiqueta por provincia
                const grouped = {};
                data.features.forEach(f => {
                    const name = (f.properties && f.properties.name) || '';
                    const key = normalizeName(name) || `__unnamed_${Math.random().toString(36).slice(2,8)}`;
                    if (!grouped[key]) grouped[key] = { nameOriginal: name, features: [] };
                    grouped[key].features.push(f);
                });

                const newFeatures = [];
                Object.keys(grouped).forEach(key => {
                    const g = grouped[key];
                    if (g.features.length === 1) {
                        // usar la feature tal cual
                        newFeatures.push(g.features[0]);
                    } else {
                        // unir las partes en una sola geometría
                        let mergedPart = g.features[0];
                        for (let i = 1; i < g.features.length; i++) {
                            try {
                                mergedPart = turf.union(mergedPart, g.features[i]);
                            } catch (e) {
                                console.error(`Error uniendo partes de ${g.nameOriginal}:`, e);
                            }
                        }
                        try { mergedPart = turf.clean(mergedPart); } catch (e) { /* ignore */ }
                        mergedPart.properties = Object.assign({}, g.features[0].properties || {});
                        mergedPart.properties.name = g.nameOriginal;
                        newFeatures.push(mergedPart);
                    }
                });

                data.features = newFeatures;

                // Crear capa GeoJSON
                let provinceIndex = {};
                geoJsonLayer = L.geoJSON(data, {
                    style: function(feature) {
                        return {
                            fillColor: feature.properties.color || '#ffcc00',
                            weight: 2,
                            opacity: 1,
                            color: 'white',
                            fillOpacity: 0.7
                        };
                    },
                    onEachFeature: function(feature, layer) {
                        const nameNorm = normalizeName(feature.properties && feature.properties.name);
                        if (nameNorm && labelsCreated.has(nameNorm)) return;  // Evitar duplicados por nombre
                        // Mejorar posicionamiento: elegir el punto más central posible sin salir del polígono
                        let coords;
                        const centroid = turf.centroid(feature);
                        const pointOn = turf.pointOnFeature(feature);
                        // Si el centroide está dentro, preferirlo (más central)
                        if (turf.booleanPointInPolygon(centroid, feature)) {
                            coords = centroid.geometry.coordinates;
                        } else {
                            // Intentar interpolar desde pointOn hacia centroid sin salir del polígono
                            const base = pointOn.geometry.coordinates;
                            const target = centroid.geometry.coordinates;
                            const factors = [0.35, 0.25, 0.15, 0.08, 0.0];
                            let chosen = base;
                            for (let f of factors) {
                                const cand = [base[0] + (target[0] - base[0]) * f, base[1] + (target[1] - base[1]) * f];
                                const candPt = turf.point(cand);
                                if (turf.booleanPointInPolygon(candPt, feature)) {
                                    chosen = cand;
                                    break;
                                }
                            }
                            coords = chosen;
                        }
                        const posKey = `${Math.round(coords[0] * 1000)}-${Math.round(coords[1] * 1000)}`;
                        if (createdPositions.has(posKey)) return;  // Evitar posiciones muy cercanas
                        // Etiqueta de tropas
                        // Aplicar offset manual si existe para esta provincia (usar claves normalizadas)
                        let anchor = [0, 0];
                        if (nameNorm && normalizedLabelOffsets[nameNorm]) {
                            anchor = normalizedLabelOffsets[nameNorm];
                        }
                        feature.troopsLabel = L.marker([coords[1], coords[0]], {
                            icon: L.divIcon({
                                className: 'troops-label',
                                html: `<div>4</div>`,
                                iconAnchor: anchor
                            })
                        }).addTo(map);
                        if (nameNorm) labelsCreated.add(nameNorm);
                        createdPositions.add(posKey);

                        layer.on({
                            mouseover: function(e) {
                                const layer = e.target;
                                layer.setStyle({
                                    weight: 3,
                                    fillOpacity: 0.9
                                });
                            },
                            mouseout: function(e) {
                                const layer = e.target;
                                geoJsonLayer.resetStyle(e.target);
                            },
                            click: function(e) {
                                selectedProvince = feature;
                                if (document.getElementById('game').style.display !== 'none') {
                                    document.getElementById('troopsModal').style.display = 'flex';
                                    document.getElementById('selectedProvince').textContent = feature.properties.name;
                                    document.getElementById('currentTroops').textContent = feature.troops || 4;
                                }
                            }
                        });

                        try {
                            feature._centroidCoords = centroid.geometry.coordinates;
                            feature._pointOnCoords = pointOn.geometry.coordinates;
                        } catch(e) {}
                        provinces.push(feature);
                        try { if (nameNorm) provinceIndex[nameNorm] = feature; } catch(e) {}
                    }
                }).addTo(map);
                map.fitBounds(geoJsonLayer.getBounds());

                mapReady = true;
                updateStartGameState();

                // Conexiones marítimas / puentes entre provincias (ataques permitidos a distancia)
                const seaConnections = [
                    ['Britannia', 'Gallia'],
                    ['Britannia', 'Belgica'],
                    ['Magna Grecia', 'Africa'],
                    ['Magna Grecia', 'Cyrenaica'],
                    ['Baetica', 'Mauretania'],
                    ['Graecia', 'Asia']
                ];

                // Construir mapa bidireccional de conexiones normalizadas (usar la variable externa)
                connectionsMap = {};
                function addConnection(a, b) {
                    const na = normalizeName(a);
                    const nb = normalizeName(b);
                    connectionsMap[na] = connectionsMap[na] || new Set();
                    connectionsMap[nb] = connectionsMap[nb] || new Set();
                    connectionsMap[na].add(nb);
                    connectionsMap[nb].add(na);
                }
                seaConnections.forEach(pair => addConnection(pair[0], pair[1]));
                // almacenar globalmente y dibujar (usar drawAllSeaConnections para soportar overrides)
                seaConnectionsGlobal = seaConnections.map(p => [p[0], p[1]]);
                function clearSeaPolylines() {
                    seaPolylineLayers.forEach(l => { try { map.removeLayer(l); } catch (e) {} });
                    seaPolylineLayers = [];
                }

                function drawAllSeaConnections() {
                    clearSeaPolylines();
                    seaConnectionsGlobal.forEach(pair => {
                        const aName = pair[0];
                        const bName = pair[1];
                        const a = findProvinceByNameLoose(aName);
                        const b = findProvinceByNameLoose(bName);
                        if (!a || !b) {
                            console.warn('Conexión marítima: provincia no encontrada', pair);
                            return;
                        }
                        // comprobar si existe override manual
                        const key = normalizeName(aName) + '|' + normalizeName(bName);
                        const cfg = seaEndpointOffsetsConfig[key];
                        const endpoints = cfg ? {
                            a: [cfg.a[1], cfg.a[0]], // convertir [lat,lng] (config) -> [lon,lat]
                            b: [cfg.b[1], cfg.b[0]]
                        } : undefined;
                        const pl = createCurvedSeaPolyline(a, b, { endpoints: endpoints });
                        if (pl) seaPolylineLayers.push(pl);
                    });
                }

                // Helper para buscar provincia por nombre (tolerante a pequeñas variaciones)
                function findProvinceByNameLoose(name) {
                    const target = normalizeName(name);
                    return provinces.find(p => {
                        const pn = normalizeName(p.properties && p.properties.name);
                        return pn === target || pn.includes(target) || target.includes(pn);
                    });
                }

                // Helper: escapar para RegExp
                function escapeRegExp(s) {
                    return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                }

                // Mejorar búsqueda tolerante de nombres para evitar emparejamientos parciales indeseados
                function findProvinceByNameLoose(name) {
                    const target = normalizeName(name);
                    if (!target) return null;
                    // 0) lookup rápido por índice si existe
                    try {
                        if (typeof provinceIndex === 'object' && provinceIndex[target]) return provinceIndex[target];
                    } catch (e) { /* ignore */ }
                    // 1) buscar igualdad exacta
                    let exact = provinces.find(p => normalizeName(p.properties && p.properties.name) === target);
                    if (exact) return exact;
                    // 2) buscar coincidencia por token (palabra completa)
                    const targetTokens = target.split(/\s+/).filter(Boolean);
                    for (let p of provinces) {
                        const pn = normalizeName(p.properties && p.properties.name);
                        const pTokens = pn.split(/\s+/).filter(Boolean);
                        // si alguno de los tokens coincide exactamente con el target
                        if (pTokens.includes(target)) return p;
                        // o si el target es exactamente uno de los tokens del nombre de la provincia
                        if (targetTokens.includes(pn)) return p;
                        // o coincidencia de palabra completa usando regex
                        try {
                            const re = new RegExp('\\b' + escapeRegExp(target) + '\\b');
                            if (re.test(pn)) return p;
                        } catch (e) { /* ignore regex errors */ }
                    }
                    // 3) fallback a búsqueda por inclusión antigua (lo último)
                    return provinces.find(p => {
                        const pn = normalizeName(p.properties && p.properties.name);
                        return pn === target || pn.includes(target) || target.includes(pn);
                    }) || null;
                }

                // Crear una polilínea curva (3 puntos) intentando evitar cruzar tierra
                function createCurvedSeaPolyline(aFeature, bFeature, options) {
                    options = options || {};
                    // permitir endpoints manuales: opciones.endpoints = { a: [lon,lat], b: [lon,lat] }
                    let pa, pb;
                    if (options.endpoints && options.endpoints.a && options.endpoints.b) {
                        pa = options.endpoints.a;
                        pb = options.endpoints.b;
                    } else {
                        pa = turf.pointOnFeature(aFeature).geometry.coordinates; // [lon, lat]
                        pb = turf.pointOnFeature(bFeature).geometry.coordinates;
                    }
                    const straight = turf.lineString([pa, pb]);

                    // comprobar si la línea cruza tierra distinta a las dos provincias
                    // Usar muestreo de puntos a lo largo de la línea y verificar punto-a-polígono
                    function lineCrossesLand(line) {
                        try {
                            const na = normalizeName(aFeature.properties && aFeature.properties.name);
                            const nb = normalizeName(bFeature.properties && bFeature.properties.name);
                            // longitud en km
                            const lineLen = (turf.length || turf.lineDistance) ? turf.length(line, { units: 'kilometers' }) : 0;
                            const samples = 16; // número de puntos a muestrear
                            for (let i = 1; i < samples; i++) {
                                const dist = (lineLen * i) / samples;
                                let pt;
                                try {
                                    pt = turf.along(line, dist, { units: 'kilometers' });
                                } catch (e) {
                                    // fallback sencillo: tomar punto interpolado
                                    const coords = line.geometry.coordinates;
                                    const t = i / samples;
                                    const x = coords[0][0] + (coords[coords.length - 1][0] - coords[0][0]) * t;
                                    const y = coords[0][1] + (coords[coords.length - 1][1] - coords[0][1]) * t;
                                    pt = turf.point([x, y]);
                                }
                                // Verificar si el punto cae dentro de alguna provincia distinta a las dos
                                for (let p of provinces) {
                                    const pn = normalizeName(p.properties && p.properties.name);
                                    if (pn === na || pn === nb) continue;
                                    try {
                                        if (turf.booleanPointInPolygon(pt, p)) return true;
                                    } catch (e) {
                                        // ignore
                                    }
                                }
                            }
                        } catch (e) {
                            // en caso de error conservador: decir que sí cruza tierra
                            return true;
                        }
                        return false;
                    }

                    if (!lineCrossesLand(straight)) {
                        // no cruza tierra: dibujar línea recta
                        const latlngs = [[pa[1], pa[0]], [pb[1], pb[0]]];
                        const poly = L.polyline(latlngs, Object.assign({ color: '#FFD36A', weight: 3, opacity: 0.9, dashArray: '8,6' }, options)).addTo(map);
                        return poly;
                    }

                    // cálculo de punto medio y vector perpendicular
                    const mid = [(pa[0] + pb[0]) / 2, (pa[1] + pb[1]) / 2];
                    const dx = pb[0] - pa[0];
                    const dy = pb[1] - pa[1];
                    const len = Math.sqrt(dx * dx + dy * dy) || 1;
                    const ux = -dy / len;
                    const uy = dx / len;

                    // distancia en km entre puntos
                    let distKm = 0;
                    try { distKm = turf.distance(turf.point(pa), turf.point(pb), { units: 'kilometers' }); } catch (e) { distKm = 100; }
                    const baseOffsetKm = Math.max(20, distKm * 0.12);

                    // probar desplazamientos crecientes en ambos lados hasta que la curva no cruce tierra
                    for (let sign of [1, -1]) {
                        for (let k = 1; k <= 6; k++) {
                            const offsetKm = baseOffsetKm * k;
                            const degOffset = offsetKm / 111; // aproximación km -> grados
                            const midOffset = [mid[0] + ux * degOffset * sign, mid[1] + uy * degOffset * sign];
                            const candidate = turf.lineString([pa, midOffset, pb]);
                            if (!lineCrossesLand(candidate)) {
                                const latlngs = [[pa[1], pa[0]], [midOffset[1], midOffset[0]], [pb[1], pb[0]]];
                                const poly = L.polyline(latlngs, Object.assign({ color: '#FFD36A', weight: 3, opacity: 0.95, dashArray: '8,6', smoothFactor: 1 }, options)).addTo(map);
                                return poly;
                            }
                        }
                    }

                    // si todo falla, regresar a línea recta como último recurso
                    const latlngs = [[pa[1], pa[0]], [pb[1], pb[0]]];
                    const poly = L.polyline(latlngs, Object.assign({ color: '#FFD36A', weight: 3, opacity: 0.9, dashArray: '8,6' }, options)).addTo(map);
                    return poly;
                }

                // Dibujar conexiones (usar la función global de dibujo para soportar overrides)
                drawAllSeaConnections();

                // Exponer función que comprueba si dos provincias están conectadas por mar
                areConnectedBySea = function(aFeature, bFeature) {
                    if (!aFeature || !bFeature) return false;
                    const na = normalizeName(aFeature.properties && aFeature.properties.name);
                    const nb = normalizeName(bFeature.properties && bFeature.properties.name);
                    return (connectionsMap[na] && connectionsMap[na].has(nb));
                };
            })
            .catch(error => {
                console.error('Error cargando GeoJSON:', error);
                if (startGameButton) {
                    startGameButton.disabled = true;
                    startGameButton.textContent = 'ERROR CARGANDO MAPA';
                }
            });

        // Configuración inicial
        if (loadQuestionsButton && questionsFileInput) {
            loadQuestionsButton.addEventListener('click', function() {
                questionsFileInput.click();
            });

            questionsFileInput.addEventListener('change', function() {
                const file = this.files && this.files[0];
                if (file) loadQuestionsFromFile(file);
                this.value = '';
            });
        }

        document.getElementById('numPlayers').addEventListener('change', function() {
            const num = parseInt(this.value);
            const playersDiv = document.getElementById('players');
            playersDiv.innerHTML = '';
            const frag = document.createDocumentFragment();
            for (let i = 0; i < num; i++) {
                const color = fixedColors[i] || '#CCCCCC';
                const entry = document.createElement('div');
                entry.className = 'player-entry';
                entry.style.display = 'flex';
                entry.style.alignItems = 'center';
                entry.style.gap = '12px';
                entry.style.margin = '8px 0';

                const swatch = document.createElement('div');
                swatch.className = 'player-swatch';
                swatch.style.background = color;

                const label = document.createElement('label');
                label.style.fontSize = '16px';
                label.style.color = '#F7E7B5';
                label.textContent = `Nombre Jugador ${i+1}: `;

                const input = document.createElement('input');
                input.type = 'text';
                input.id = `player${i}Name`;
                input.value = `Jugador ${i+1}`;
                label.appendChild(input);

                entry.appendChild(swatch);
                entry.appendChild(label);
                frag.appendChild(entry);
            }
            playersDiv.appendChild(frag);
        });
        document.getElementById('numPlayers').dispatchEvent(new Event('change'));

        // Mostrar el panel de configuración centrado al cargar
        document.getElementById('gameUI').classList.add('centered-setup');

        document.getElementById('startGame').addEventListener('click', function() {
            if (!mapReady) {
                alert('El mapa todavía se está cargando. Espera un momento antes de iniciar la partida.');
                return;
            }
            if (!questionsReady || questions.length === 0) {
                alert('Carga un archivo JSON de preguntas antes de iniciar la partida.');
                return;
            }
            const num = Number.parseInt(document.getElementById('numPlayers').value);
            players = [];
            for (let i = 0; i < num; i++) {
                players.push({
                    name: document.getElementById(`player${i}Name`).value,
                    color: fixedColors[i] || '#000000',
                    provinces: []
                });
            }
            assignProvinces();
            // Quitar estilo centrado y volver a la barra lateral para el juego
            document.getElementById('gameUI').classList.remove('centered-setup');
            document.getElementById('setup').style.display = 'none';
            document.getElementById('game').style.display = 'block';
            updateUI();
        });

        // Interfaz de edición manual de conexiones eliminada: use `seaEndpointOffsetsConfig` para configurar endpoints manuales.

        function assignProvinces() {
            const numPlayers = players.length;
            const shuffled = [...provinces].sort(() => Math.random() - 0.5);
            shuffled.forEach((prov, index) => {
                const playerIndex = index % numPlayers;
                prov.owner = playerIndex;
                prov.troops = 3;
                players[playerIndex].provinces.push(prov);
                prov.properties.color = players[playerIndex].color;
                geoJsonLayer.eachLayer(layer => {
                    if (layer.feature === prov) {
                        layer.setStyle({ fillColor: players[playerIndex].color });
                    }
                });
                prov.troopsLabel.getElement().innerHTML = `<div>${prov.troops}</div>`;
            });
        }

        function updateUI() {
            document.getElementById('currentPlayer').textContent = players[currentPlayerIndex].name;
            // Actualizar lista de jugadores
            const playersListDiv = document.getElementById('playersList');
            playersListDiv.innerHTML = '';
            const frag = document.createDocumentFragment();
            const h4 = document.createElement('h4');
            h4.textContent = 'Estado de Jugadores';
            frag.appendChild(h4);
            players.forEach(player => {
                const numProvinces = player.provinces.length;
                const totalTroops = player.provinces.reduce((sum, prov) => sum + prov.troops, 0);
                const item = document.createElement('div');
                item.className = 'player-info';

                const colorBox = document.createElement('div');
                colorBox.className = 'player-color';
                colorBox.style.backgroundColor = player.color;

                const details = document.createElement('div');
                details.className = 'player-details';
                details.innerHTML = `<strong>${player.name}</strong><br>Provincias: ${numProvinces} | Tropas: ${totalTroops}`;

                item.appendChild(colorBox);
                item.appendChild(details);
                frag.appendChild(item);
            });
            playersListDiv.appendChild(frag);
            checkVictory();
        }

        function checkVictory() {
            // No comprobar victoria si las provincias no se han cargado aún
            if (!provinces || provinces.length === 0) return;
            for (let player of players) {
                if (player.provinces.length === provinces.length) {
                    showVictory(player, `${player.name} gana la partida!`);
                    return;
                }
            }
            if (questionsReady && questions.length > 0 && questions.length === usedQuestions.length) {
                let maxTroops = 0;
                let winner = null;
                players.forEach(player => {
                    const totalTroops = player.provinces.reduce((sum, prov) => sum + prov.troops, 0);
                    if (totalTroops > maxTroops) {
                        maxTroops = totalTroops;
                        winner = player;
                    }
                });
                showVictory(winner, `${winner.name} gana la partida con ${maxTroops} tropas!`);
            }
        }

        // Modificar tropas (proteger en caso de que el botón no exista en el DOM)
        const modifyBtn = document.getElementById('modifyTroops');
        if (modifyBtn) {
            modifyBtn.addEventListener('click', function() {
                if (selectedProvince) {
                    const modal = document.getElementById('troopsModal');
                    if (modal) modal.style.display = 'flex';
                } else {
                    alert('Selecciona una provincia primero.');
                }
            });
        }

        document.getElementById('increaseTroops').addEventListener('click', function() {
            if (selectedProvince.troops < 99) { // límite arbitrario
                selectedProvince.troops++;
                document.getElementById('currentTroops').textContent = selectedProvince.troops;
                selectedProvince.troopsLabel.getElement().innerHTML = `<div>${selectedProvince.troops}</div>`;
                updateUI();
            }
        });

        document.getElementById('decreaseTroops').addEventListener('click', function() {
            if (selectedProvince.troops > 1) {
                selectedProvince.troops--;
                document.getElementById('currentTroops').textContent = selectedProvince.troops;
                selectedProvince.troopsLabel.getElement().innerHTML = `<div>${selectedProvince.troops}</div>`;
                updateUI();
            }
        });

        document.getElementById('closeTroops').addEventListener('click', function() {
            document.getElementById('troopsModal').style.display = 'none';
        });

        // Ataque
        document.getElementById('attack').addEventListener('click', function() {
            const attackerSelect = document.getElementById('attackerProvince');
            const targetSelect = document.getElementById('targetProvince');
            // limpiar selects
            while (attackerSelect.firstChild) attackerSelect.removeChild(attackerSelect.firstChild);
            while (targetSelect.firstChild) targetSelect.removeChild(targetSelect.firstChild);
            // Recolectar y ordenar alfabeticamente las provincias atacantes, mostrando tropas
            const attackerOptions = (players[currentPlayerIndex] && players[currentPlayerIndex].provinces || [])
                .filter(p => p.troops >= 2)
                .map(p => ({ name: p.properties && p.properties.name, troops: p.troops }))
                .filter(o => o.name)
                .sort((a, b) => a.name.localeCompare(b.name, 'es', { sensitivity: 'base' }));

            attackerOptions.forEach(o => {
                const opt = document.createElement('option');
                opt.value = o.name;
                opt.textContent = `${o.name} (${o.troops})`;
                attackerSelect.appendChild(opt);
            });
            // Seleccionar el primer atacante válido y forzar el change para poblar targets
            if (attackerSelect.options.length > 0) {
                attackerSelect.selectedIndex = 0;
                attackerSelect.dispatchEvent(new Event('change'));
            }
            // targetSelect se llena cuando se selecciona attacker
            document.getElementById('attackModal').style.display = 'flex';
        });

        // Event listener para actualizar targets cuando cambia attacker
        document.getElementById('attackerProvince').addEventListener('change', function() {
            const selectedAttackerName = this.value;
            const attacker = provinces.find(p => p.properties.name === selectedAttackerName);
            const targetSelect = document.getElementById('targetProvince');
            // limpiar options previas
            while (targetSelect.firstChild) targetSelect.removeChild(targetSelect.firstChild);
            if (!attacker) return;
            // Recolectar objetivos válidos y ordenarlos alfabéticamente, mostrando tropas
            const targetOptions = provinces
                .filter(prov => prov.owner !== currentPlayerIndex && (turf.booleanIntersects(attacker, prov) || areConnectedBySea(attacker, prov)))
                .map(p => ({ name: p.properties && p.properties.name, troops: p.troops }))
                .filter(o => o.name)
                .sort((a, b) => a.name.localeCompare(b.name, 'es', { sensitivity: 'base' }));
            targetOptions.forEach(o => {
                const opt = document.createElement('option');
                opt.value = o.name;
                opt.textContent = `${o.name} (${o.troops})`;
                targetSelect.appendChild(opt);
            });
        });

        document.getElementById('confirmAttack').addEventListener('click', function() {
            const attackerName = document.getElementById('attackerProvince').value;
            const targetName = document.getElementById('targetProvince').value;
            const attacker = provinces.find(p => p.properties.name === attackerName);
            const target = provinces.find(p => p.properties.name === targetName);
            if (attacker && target) {
                document.getElementById('attackModal').style.display = 'none';
                showQuestion(attacker, target);
            }
        });

        document.getElementById('closeAttack').addEventListener('click', function() {
            document.getElementById('attackModal').style.display = 'none';
        });

        document.getElementById('nextTurn').addEventListener('click', function() {
            currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
            updateUI();
        });

        // Guardar / Cargar partidas
        let pendingLoadData = null; // si se intenta cargar antes de que provinces esté listo

        function exportGame() {
            return {
                numPlayers: players.length,
                currentPlayerIndex: currentPlayerIndex,
                questionsFileName: loadedQuestionsFileName || null,
                questions: questions.map(q => ({ id: q.id, pregunta: q.pregunta, respuesta: q.respuesta })),
                usedQuestionIds: [...usedQuestions],
                provinces: provinces.map(p => ({ name: p.properties && p.properties.name ? p.properties.name : (p.name || ''), owner: p.owner, troops: p.troops }))
            };
        }

        async function saveGame() {
            const dataStr = JSON.stringify(exportGame(), null, 2);
            // Intentar usar File System Access API si está disponible
            if (window.showSaveFilePicker) {
                try {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: 'partida.json',
                        types: [{ description: 'Partida JSON', accept: { 'application/json': ['.json'] } }]
                    });
                    const writable = await handle.createWritable();
                    await writable.write(dataStr);
                    await writable.close();
                    alert('Partida guardada correctamente.');
                } catch (e) {
                    console.error('Save cancelled or failed', e);
                }
            } else {
                // Fallback: descargar como archivo
                const blob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'partida.json';
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
            }
        }

        function loadGameFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const obj = JSON.parse(e.target.result);
                    applyLoadedGame(obj);
                } catch (ex) {
                    alert('Archivo de partida inválido.');
                    console.error(ex);
                }
            };
            reader.readAsText(file);
        }

        function applyLoadedGame(obj) {
            if (!obj || !Array.isArray(obj.provinces) || typeof obj.numPlayers !== 'number' || !Array.isArray(obj.questions) || obj.questions.length === 0) {
                alert('Archivo de partida con formato incorrecto o sin preguntas guardadas.');
                return;
            }
            // Si provinces no está lista aún, guardar en pending
            if (!provinces || provinces.length === 0) {
                pendingLoadData = obj;
                return;
            }
            try {
                setQuestionsData(obj.questions, {
                    fileName: obj.questionsFileName || '',
                    sourceLabel: obj.questionsFileName
                        ? `Preguntas restauradas: ${obj.questionsFileName}`
                        : 'Preguntas restauradas desde la partida',
                    usedIds: Array.isArray(obj.usedQuestionIds) ? obj.usedQuestionIds : []
                });
            } catch (error) {
                alert(`La partida guardada incluye preguntas no válidas: ${error.message}`);
                console.error('Error restaurando preguntas de la partida:', error);
                return;
            }
            // Inicializar jugadores según numPlayers
            players = [];
            for (let i = 0; i < obj.numPlayers; i++) {
                players.push({ name: `Jugador ${i+1}`, color: fixedColors[i] || '#CCCCCC', provinces: [] });
            }
            // Limpiar propietarios actuales
            provinces.forEach(p => { p.owner = null; p.troops = p.troops || 0; });

            // Crear un mapa de las provincias guardadas por nombre normalizado
            const savedMap = {};
            obj.provinces.forEach(s => { savedMap[normalizeName(s.name)] = s; });

            // Aplicar datos a cada provincia conocida (usar names normalizados para evitar mismatch)
            provinces.forEach(prov => {
                const name = (prov.properties && prov.properties.name) || prov.name || '';
                const sn = normalizeName(name);
                const saved = savedMap[sn];
                if (saved) {
                    prov.owner = (typeof saved.owner === 'number') ? saved.owner : null;
                    prov.troops = (typeof saved.troops === 'number') ? saved.troops : (prov.troops || 1);
                    prov.properties = prov.properties || {};
                    if (prov.owner !== null && players[prov.owner]) {
                        players[prov.owner].provinces.push(prov);
                        prov.properties.color = players[prov.owner].color;
                    } else {
                        // si no tiene owner en el guardado, borrar color
                        delete prov.properties.color;
                    }
                    // actualizar label si existe
                    if (prov.troopsLabel && prov.troopsLabel.getElement) {
                        try { prov.troopsLabel.getElement().innerHTML = `<div>${prov.troops}</div>`; } catch (e) {}
                    }
                } else {
                    // no guardada en el archivo -> dejar sin propietario
                    prov.owner = null;
                }
            });

            // Actualizar cada layer del geoJsonLayer según el prov correspondiente
            if (geoJsonLayer) {
                geoJsonLayer.eachLayer(layer => {
                    const feat = layer.feature;
                    const lname = (feat && feat.properties && feat.properties.name) || feat && feat.name || '';
                    const pn = normalizeName(lname);
                    const prov = provinces.find(p => normalizeName((p.properties && p.properties.name) || p.name || '') === pn);
                    if (prov) {
                        layer.feature.properties = Object.assign(layer.feature.properties || {}, prov.properties || {});
                        const fill = (prov.owner !== null && players[prov.owner]) ? players[prov.owner].color : (layer.feature.properties && layer.feature.properties.color) || '#ffcc00';
                        try { layer.setStyle && layer.setStyle({ fillColor: fill, color: 'white' }); } catch (e) {}
                    } else {
                        // si no encontramos la prov, resetear estilo por si acaso
                        try { geoJsonLayer.resetStyle && geoJsonLayer.resetStyle(layer); } catch (e) {}
                    }
                });
            }
            currentPlayerIndex = typeof obj.currentPlayerIndex === 'number' ? obj.currentPlayerIndex % players.length : 0;
            // Entrar en la vista de juego
            document.getElementById('initialOverlay').style.display = 'none';
            document.getElementById('gameUI').classList.remove('centered-setup');
            document.getElementById('setup').style.display = 'none';
            document.getElementById('game').style.display = 'block';
            updateUI();
        }

        // Botones del overlay
        document.getElementById('newGameBtn').addEventListener('click', function() {
            document.getElementById('initialOverlay').style.display = 'none';
            clearQuestionsState();
            // dejar la pantalla de setup centrada como está
        });

        document.getElementById('loadGameBtn').addEventListener('click', function() {
            document.getElementById('loadFileInput').click();
        });

        document.getElementById('loadFileInput').addEventListener('change', function(e) {
            const file = this.files && this.files[0];
            if (file) loadGameFile(file);
            // limpiar valor para permitir volver a seleccionar el mismo archivo
            this.value = '';
        });

        // Guardar desde el botón en la UI
        document.getElementById('saveGame').addEventListener('click', function() {
            saveGame();
        });

        // Si se cargó antes de tener provinces, aplicar cuando esté listo
        (function waitPendingLoad() {
            if (pendingLoadData && provinces && provinces.length > 0) {
                applyLoadedGame(pendingLoadData);
                pendingLoadData = null;
            } else {
                setTimeout(waitPendingLoad, 500);
            }
        })();

        function showQuestion(attacker, target) {
            if (!questionsReady || questions.length === 0) {
                alert('No hay preguntas cargadas para continuar el ataque.');
                return;
            }
            if (questions.length === usedQuestions.length) {
                checkVictory();
                return;
            }
            const availableQuestions = questions.filter(q => !usedQuestions.includes(q.id));
            if (availableQuestions.length === 0) {
                checkVictory();
                return;
            }
            const question = availableQuestions[Math.floor(Math.random() * availableQuestions.length)];
            usedQuestions.push(question.id);
            document.getElementById('questionText').textContent = question.pregunta;
            document.getElementById('answerText').textContent = question.respuesta;
            document.getElementById('answerText').style.display = 'none';
            document.getElementById('showAnswer').style.display = 'inline';
            document.getElementById('attackSuccess').style.display = 'none';
            document.getElementById('attackFailure').style.display = 'none';
            // Ocultar el botón de repetir cuando se muestra una nueva pregunta
            const repeatBtn = document.getElementById('repeatQuestion');
            if (repeatBtn) repeatBtn.style.display = 'none';
            document.getElementById('questionModal').style.display = 'flex';
        }

        document.getElementById('showAnswer').addEventListener('click', function() {
            document.getElementById('answerText').style.display = 'block';
            document.getElementById('attackSuccess').style.display = 'inline';
            document.getElementById('attackFailure').style.display = 'inline';
            document.getElementById('showAnswer').style.display = 'none';
            // Mostrar el botón de repetir pregunta cuando se revela la respuesta
            const repeatBtn = document.getElementById('repeatQuestion');
            if (repeatBtn) repeatBtn.style.display = 'inline';
        });

        document.getElementById('repeatQuestion').addEventListener('click', function() {
            // Volver a mostrar una pregunta nueva sin resolver el ataque aún
            const attackerName = document.getElementById('attackerProvince') ? document.getElementById('attackerProvince').value : null;
            const targetName = document.getElementById('targetProvince') ? document.getElementById('targetProvince').value : null;
            const attacker = provinces.find(p => p.properties && p.properties.name === attackerName);
            const target = provinces.find(p => p.properties && p.properties.name === targetName);
            if (attacker && target) {
                showQuestion(attacker, target);
            }
        });

        document.getElementById('attackSuccess').addEventListener('click', function() {
            const attackerName = document.getElementById('attackerProvince').value;
            const targetName = document.getElementById('targetProvince').value;
            const attacker = provinces.find(p => p.properties.name === attackerName);
            const target = provinces.find(p => p.properties.name === targetName);
            // Cambiar propietario
            const oldOwner = target.owner;
            players[oldOwner].provinces = players[oldOwner].provinces.filter(p => p !== target);
            target.owner = currentPlayerIndex;
            players[currentPlayerIndex].provinces.push(target);
            target.properties.color = players[currentPlayerIndex].color;
            geoJsonLayer.eachLayer(layer => {
                if (layer.feature === target) {
                    layer.setStyle({ fillColor: players[currentPlayerIndex].color });
                }
            });
            // Mover tropas
            target.troops = attacker.troops - 1;
            attacker.troops = 1;
            attacker.troopsLabel.getElement().innerHTML = `<div>${attacker.troops}</div>`;
            target.troopsLabel.getElement().innerHTML = `<div>${target.troops}</div>`;
            document.getElementById('questionModal').style.display = 'none';
            updateUI();
        });

        document.getElementById('attackFailure').addEventListener('click', function() {
            const attackerName = document.getElementById('attackerProvince').value;
            const attacker = provinces.find(p => p.properties.name === attackerName);
            attacker.troops = 1;
            attacker.troopsLabel.getElement().innerHTML = `<div>${attacker.troops}</div>`;
            document.getElementById('questionModal').style.display = 'none';
            updateUI();
        });

        // Mostrar modal de victoria
        function showVictory(player, details) {
            try {
                const modal = document.getElementById('victoryModal');
                if (!modal) return alert(details || '¡Victoria!');
                document.getElementById('victoryName').textContent = player.name || 'Jugador';
                document.getElementById('victoryDetails').textContent = details || '';
                const colorBox = document.getElementById('victoryColor');
                if (colorBox) colorBox.style.background = (player.color || '#DDD');
                modal.style.display = 'flex';
                // botones
                const closeBtn = document.getElementById('victoryClose');
                const newBtn = document.getElementById('victoryNew');
                if (closeBtn) closeBtn.onclick = () => { modal.style.display = 'none'; };
                if (newBtn) newBtn.onclick = () => { window.location.reload(); };
            } catch (e) {
                console.error('Error mostrando modal de victoria', e);
                alert(details || '¡Victoria!');
            }
        }
    })();
    </script>
</body>
